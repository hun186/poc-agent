<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dual-Mode Word Report API Architecture</title>
  <desc id="desc">Architecture diagram showing synchronous and asynchronous report generation paths using a shared execution core.</desc>
  <defs>
    <style>
      .box { fill: #f8fbff; stroke: #2b5f9e; stroke-width: 2; rx: 10; ry: 10; }
      .store { fill: #fffaf0; stroke: #996c00; stroke-width: 2; rx: 10; ry: 10; }
      .core { fill: #f4fff6; stroke: #2f7d32; stroke-width: 2; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #1f2a33; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #33424d; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: bold; fill: #17324d; }
      .arrow { stroke: #4b5a67; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 7 6; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; fill: #17324d; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4b5a67" />
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" class="title">Dual-Mode Word Report API</text>

  <text x="170" y="95" text-anchor="middle" class="section">Clients</text>
  <rect x="40" y="115" width="260" height="85" class="box" />
  <text x="170" y="150" text-anchor="middle" class="label">Manual / One-off Clients</text>
  <text x="170" y="175" text-anchor="middle" class="small">Chrome F12, browser, curl, single script</text>

  <rect x="40" y="250" width="260" height="85" class="box" />
  <text x="170" y="285" text-anchor="middle" class="label">Batch / Scheduler Clients</text>
  <text x="170" y="310" text-anchor="middle" class="small">Python scheduler, cron, automation jobs</text>

  <text x="520" y="95" text-anchor="middle" class="section">API Layer</text>
  <rect x="365" y="115" width="310" height="90" class="box" />
  <text x="520" y="150" text-anchor="middle" class="label">POST /v1/report/word</text>
  <text x="520" y="175" text-anchor="middle" class="small">Synchronous Word response</text>

  <rect x="365" y="250" width="310" height="90" class="box" />
  <text x="520" y="282" text-anchor="middle" class="label">POST /v1/report/jobs</text>
  <text x="520" y="305" text-anchor="middle" class="small">Create job, return 202 + job_id</text>

  <rect x="365" y="385" width="310" height="90" class="box" />
  <text x="520" y="417" text-anchor="middle" class="label">GET /v1/report/jobs/{job_id}</text>
  <text x="520" y="440" text-anchor="middle" class="small">Poll status / metadata</text>

  <rect x="365" y="520" width="310" height="90" class="box" />
  <text x="520" y="552" text-anchor="middle" class="label">GET /v1/report/jobs/{job_id}/word</text>
  <text x="520" y="575" text-anchor="middle" class="small">Download DOCX after completion</text>

  <text x="860" y="95" text-anchor="middle" class="section">Shared Core & Persistence</text>
  <rect x="735" y="140" width="250" height="100" class="core" />
  <text x="860" y="178" text-anchor="middle" class="label">Shared Turn Execution Core</text>
  <text x="860" y="203" text-anchor="middle" class="small">execute_agent_turn()</text>
  <text x="860" y="223" text-anchor="middle" class="small">common retrieval + report flow</text>

  <rect x="735" y="285" width="250" height="85" class="core" />
  <text x="860" y="320" text-anchor="middle" class="label">Word Export Service</text>
  <text x="860" y="345" text-anchor="middle" class="small">Render DOCX from turn result</text>

  <rect x="735" y="420" width="250" height="90" class="store" />
  <text x="860" y="455" text-anchor="middle" class="label">SQLite Job Store</text>
  <text x="860" y="480" text-anchor="middle" class="small">job state, metadata, docx path</text>

  <rect x="735" y="555" width="250" height="90" class="store" />
  <text x="860" y="590" text-anchor="middle" class="label">Reports Directory</text>
  <text x="860" y="615" text-anchor="middle" class="small">.api_jobs/reports/*.docx</text>

  <rect x="1020" y="250" width="140" height="115" class="box" />
  <text x="1090" y="288" text-anchor="middle" class="label">Background</text>
  <text x="1090" y="312" text-anchor="middle" class="label">Worker</text>
  <text x="1090" y="337" text-anchor="middle" class="small">concurrency = 1</text>

  <rect x="1020" y="115" width="140" height="85" class="box" />
  <text x="1090" y="148" text-anchor="middle" class="label">LLM / ES</text>
  <text x="1090" y="173" text-anchor="middle" class="small">upstream services</text>

  <path d="M300 157 L365 157" class="arrow" />
  <path d="M300 292 L365 292" class="arrow" />

  <path d="M675 160 L735 190" class="arrow" />
  <path d="M985 190 L1020 170" class="arrow" />
  <path d="M860 240 L860 285" class="arrow" />
  <path d="M860 370 L860 420" class="arrow" />
  <path d="M860 510 L860 555" class="arrow" />

  <path d="M675 292 L1020 292" class="arrow" />
  <path d="M1090 250 L1090 210 L985 210" class="arrow" />
  <path d="M1020 340 L985 340" class="arrow dashed" />
  <path d="M1020 330 L985 465" class="arrow" />
  <path d="M1090 365 L1090 600 L985 600" class="arrow" />

  <path d="M675 430 L735 465" class="arrow dashed" />
  <path d="M675 565 L735 600" class="arrow dashed" />

  <path d="M520 340 L520 385" class="arrow dashed" />
  <path d="M520 475 L520 520" class="arrow dashed" />

  <text x="210" y="710" class="small">Sync mode: one request waits and directly receives DOCX.</text>
  <text x="210" y="735" class="small">Async mode: create job quickly, worker runs report, client polls status, then downloads DOCX.</text>
  <text x="780" y="710" class="small">Both modes reuse the same execution core and Word export service.</text>
  <text x="780" y="735" class="small">Async mode persists status in SQLite and stores generated files on disk.</text>
</svg>
