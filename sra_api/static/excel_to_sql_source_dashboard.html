<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SQL 來源資料統計儀表板</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#d9deea;--text:#172033;--muted:#667085;--ok:#027a48;--bad:#b42318;--info:#175cd3}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:20px 28px;background:#111827;color:white;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:13px}.header-actions,.row{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.header-user{color:#cbd5e1;font-size:13px;font-weight:700}button{padding:10px 14px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;cursor:pointer}button.secondary{background:#475467}main{max-width:1440px;margin:0 auto;padding:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:16px}label{font-weight:600;font-size:13px;display:block;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:white}.toolbar,.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end;margin:12px 0}.status{padding:12px;border-radius:12px;margin:12px 0;background:#eef4ff;color:var(--info);white-space:pre-wrap}.status.ok{background:#ecfdf3;color:var(--ok)}.status.error{background:#fef3f2;border:1px solid #fecdca;color:var(--bad)}.hidden{display:none}.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}.stat-card{border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc;padding:14px}.stat-card strong{display:block;font-size:28px;margin-top:4px}.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.group-card h3{margin:0 0 10px}.bucket{display:grid;grid-template-columns:minmax(80px,1fr) 70px;gap:8px;align-items:center;margin:7px 0}.bar{height:12px;border-radius:999px;background:#dbeafe;overflow:hidden}.bar span{display:block;height:100%;background:#2563eb}.checkboxes{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:white}.checkboxes label{display:flex;gap:8px;align-items:center;font-weight:500}.checkboxes input{width:auto}.two-col{grid-column:span 2}.header-actions button{padding:8px 10px}.scope-note{line-height:1.6}.chart-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc;margin:8px 0 14px}.chart-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.chart-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.chart-controls select{min-width:150px}.audit-chart{width:100%;min-height:240px;display:block}.chart-axis{stroke:#cbd5e1;stroke-width:1}.chart-grid{stroke:#e2e8f0;stroke-width:1}.chart-line{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-point{fill:#2563eb;stroke:white;stroke-width:2}.chart-label{fill:#475467;font-size:11px}.chart-empty{color:var(--muted);padding:48px 0;text-align:center}
</style></head>
<body><header><div><h1>SQL 來源資料統計儀表板</h1><div class="muted" style="color:#cbd5e1;">針對已啟用 Excel→SQL 任務的 SQL 來源資料做篩選、總量與分群統計</div></div><div class="header-actions"><button onclick="location.href='/agent-data-flow'">代理人資料流程圖</button><div id="whoami" class="header-user">未登入</div><button onclick="location.href='/excel-to-sql-dashboard'">Excel→SQL 匯入查詢儀表板</button><button onclick="location.href='/excel-to-sql-source-editor'">SQL 來源資料編輯器</button><button onclick="location.href='/excel-to-sql-import-center'">Excel 匯入作業中心</button><button onclick="location.href='/excel-to-sql-task-configs'">任務 JSON 管理</button><button class="secondary" onclick="location.href='/editor'">前往登入 / 編輯器</button></div></header>
<main><section class="card"><h2>統計條件</h2><p class="muted scope-note">此頁沿用 SQL 來源資料編輯器的受控任務白名單，只能分析已啟用任務的 <code>destination.table</code>。可依匯入時間、來源 Excel、使用者、hash、資料欄位關鍵字篩選，並可自行勾選分群屬性。</p><div class="toolbar"><div><label>任務</label><select id="task"></select></div><div class="two-col"><label>設定檔</label><input id="config" value="config/excel_to_sql/vessel_activities.example.json" /></div><div><label>關鍵字</label><input id="query" placeholder="跨前 12 個欄位搜尋" /></div><div><label>Top N</label><input id="topN" type="number" min="1" max="100" value="20" /></div></div><div class="filters"><div><label>來源 Excel 包含</label><input id="sourceFileFilter" /></div><div><label>匯入執行起</label><input id="importStartFilter" type="datetime-local" /></div><div><label>匯入執行迄</label><input id="importEndFilter" type="datetime-local" /></div><div><label>列號</label><input id="rowNoFilter" type="number" min="1" /></div><div><label>hash 包含</label><input id="hashFilter" /></div><div><label>資料欄位關鍵字</label><input id="payloadFilter" /></div><div><label>匯入使用者（逗號分隔）</label><input id="usernameFilter" placeholder="例如 alice,bob" /></div><div><button id="loadBtn">重新整理統計</button></div></div><h3>自訂分群屬性</h3><div id="groupFields" class="checkboxes"><div class="muted">載入後可勾選欄位</div></div><div id="status" class="status hidden"></div></section><section class="card"><h2>統計結果</h2><div id="summaryCards" class="stat-cards"></div><div class="chart-card"><div class="chart-title"><div><strong id="importSeriesTitle">來源資料筆數統計曲線（套用目前篩選）</strong><div id="importSeriesSummary" class="muted">尚未載入</div></div><div class="chart-controls"><div><label for="chartBucket">曲線圖時間區間</label><select id="chartBucket" aria-label="曲線圖時間區間設定"><option value="hour">每小時</option><option value="6_hours">每 6 小時</option><option value="12_hours">每 12 小時</option><option value="day" selected>每日</option><option value="week">每週</option><option value="month">每月</option></select></div></div></div><div id="importSeriesChart" class="chart-empty">尚未載入曲線</div></div><div id="groups" class="group-grid"></div></section></main>
<script src="/static/audit_tools.js"></script><script src="/static/excel_to_sql_source_dashboard_app.js?v=20260703-source-dashboard-import-series"></script></body></html>
