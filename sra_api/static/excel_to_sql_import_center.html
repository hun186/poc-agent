<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel 匯入作業中心</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --card:#fff; --line:#d9deea; --text:#172033; --muted:#667085; --ok:#027a48; --warn:#b54708; --bad:#b42318; --info:#175cd3; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { padding:20px 28px; background:#111827; color:white; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size:22px; }
    main { padding:24px; max-width:1500px; margin:0 auto; }
    .controls, .filters { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items:end; margin:12px 0 14px; }
    .config-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin:14px 0; }
    .config-group { border:1px solid #e4e7ec; border-radius:14px; padding:14px; background:#fbfcff; }
    .config-group h3 { margin:0 0 4px; font-size:16px; color:#1d4ed8; display:flex; align-items:center; gap:8px; }
    .config-group h3::before { content:""; width:8px; height:20px; border-radius:999px; background:#2563eb; display:inline-block; }
    .config-group .controls { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom:0; }
    .section-title { margin:18px 0 8px; padding-top:12px; border-top:1px dashed #cbd5e1; color:#344054; }
    .review-details { margin-top:12px; border:1px solid #dbeafe; border-radius:14px; background:#f8fbff; padding:12px; }
    .review-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin:10px 0; }
    .review-card { border:1px solid #e4e7ec; border-radius:12px; background:white; padding:10px; }
    .review-card h4 { margin:0 0 6px; font-size:13px; color:#175cd3; }
    .review-card ul { margin:0; padding-left:18px; }
    .review-json { max-height:280px; overflow:auto; background:#0f172a; color:#e2e8f0; border-radius:12px; padding:12px; font-size:12px; line-height:1.5; }
    .type-help { margin:10px 0 14px; border:1px solid #fde68a; background:#fffbeb; border-radius:12px; padding:10px; }
    .type-help summary { cursor:pointer; font-weight:800; color:#92400e; }
    .type-help ul { margin:8px 0 0 18px; padding:0; color:#475467; font-size:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(16,24,40,.05); margin-bottom:16px; }
    .muted { color:var(--muted); font-size:13px; }
    label { font-weight:600; font-size:13px; display:block; margin-bottom:6px; }
    input, select { width:100%; box-sizing:border-box; padding:10px 11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:white; }
    button { padding:10px 14px; border:0; border-radius:10px; background:#2563eb; color:white; font-weight:700; cursor:pointer; }
    button.secondary { background:#475467; }
    button.ghost { background:#e2e8f0; color:#172033; }
    .mapping-row { display:grid; grid-template-columns: 1.2fr 1.2fr 1fr .7fr .7fr auto; gap:10px; align-items:end; margin:8px 0; }
    .composite-row { display:grid; grid-template-columns: 1.2fr 1fr 1.6fr .7fr 1fr .6fr auto; gap:10px; align-items:end; margin:8px 0; }
    .mapping-row button { padding:9px 10px; }
    .checkbox-line { display:flex; gap:8px; align-items:center; font-size:13px; font-weight:600; }
    .checkbox-line input { width:auto; }
    .header-actions, .upload-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .record-actions { display:grid; grid-template-columns: minmax(0, 1fr); gap:6px; min-width:128px; }
    .record-actions button { width:100%; padding:7px 9px; font-size:12px; white-space:normal; line-height:1.25; }
    .header-user { color:#cbd5e1; font-size:13px; font-weight:700; white-space:nowrap; }
    .preview-box { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#f8fafc; }
    .error { background:#fef3f2; border:1px solid #fecdca; color:var(--bad); padding:12px; border-radius:12px; margin:12px 0; white-space:pre-wrap; }
    .hidden { display:none; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    .import-records-table { table-layout:fixed; }
    th, td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top; }
    #importRecords th, #importRecords td { overflow-wrap:anywhere; word-break:break-word; }
    th { color:#344054; font-size:12px; background:#f9fafb; position:sticky; top:0; }
    .table-wrap { overflow:auto; max-height:620px; border:1px solid var(--line); border-radius:12px; }
    .status { display:inline-block; border-radius:999px; padding:2px 8px; font-weight:700; font-size:12px; background:#eef4ff; color:var(--info); }
    .status.imported { background:#ecfdf3; color:var(--ok); }
    .status.imported_with_errors { background:#fef3f2; color:var(--bad); }
    .status.deleted { background:#f2f4f7; color:#344054; }
    .diagnostics { min-width:0; }
    .diagnostics details { margin-top:6px; }
    .diagnostics summary { color:var(--info); cursor:pointer; font-weight:700; list-style-position:inside; }
    .diagnostics summary:hover { text-decoration:underline; }
    .diagnostics ul { margin:6px 0 0 18px; padding:0; }
    .record-mobile-summary { display:none; }
    @media (max-width: 900px) { .controls, .filters, .mapping-row { grid-template-columns:1fr; } }
    @media (min-width: 901px) {
      #importRecords .select-col { width:3%; }
      #importRecords .date-col { width:11%; }
      #importRecords .user-col { width:6%; }
      #importRecords .original-file-col { width:13%; }
      #importRecords .stored-file-col { width:9%; }
      #importRecords .config-col { width:8%; }
      #importRecords .status-col { width:8%; }
      #importRecords .count-col { width:4%; }
      #importRecords .size-col { width:5%; }
      #importRecords .diagnostics-col { width:13%; }
      #importRecords .actions-col { width:10%; }
    }
    @media (max-width: 760px) {
      main { padding:14px; }
      header { padding:16px; align-items:flex-start; }
      .header-actions, .upload-actions { width:100%; justify-content:stretch; }
      .header-actions button, .upload-actions button { flex:1 1 100%; }
      .table-wrap.import-records-wrap { overflow:visible; max-height:none; border:0; }
      .import-records-table, .import-records-table thead, .import-records-table tbody, .import-records-table tr, .import-records-table th, .import-records-table td { display:block; width:100%; box-sizing:border-box; }
      .import-records-table thead { display:none; }
      .import-records-table tr { margin:12px 0; border:1px solid var(--line); border-radius:14px; background:white; box-shadow:0 1px 2px rgba(16,24,40,.05); overflow:hidden; }
      .import-records-table td { display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid #eef2f7; padding:10px 12px; }
      .import-records-table td::before { content:attr(data-label); flex:0 0 7.5em; color:var(--muted); font-weight:700; }
      .import-records-table td[data-label="操作"] { display:block; }
      .import-records-table td[data-label="操作"]::before { display:block; margin-bottom:8px; }
      .record-actions { min-width:0; grid-template-columns:1fr; }
      .record-actions button { width:100%; padding:10px 12px; font-size:14px; }
      .diagnostics { width:100%; }
    }
  </style>
</head>
<body>
<header>
  <div>
    <h1>Excel 匯入作業中心</h1>
    <div class="muted" style="color:#cbd5e1;">上傳 Excel、預掃描、確認匯入 SQL，並管理使用者匯入記錄</div>
  </div>
  <div class="header-actions">
    <div id="whoami" class="header-user">未登入</div>
    <button onclick="location.href='/excel-to-sql-dashboard'">Excel→SQL 匯入查詢儀表板</button>
    <button onclick="location.href='/excel-to-sql-source-editor'">SQL 來源資料編輯器</button>
    <button onclick="location.href='/excel-to-sql-task-configs'">任務 JSON 管理</button>
    <button class="secondary" onclick="location.href='/editor'">前往登入 / 編輯器</button>
  </div>
</header>
<main>
  <div id="msg" class="error hidden"></div>
  <section class="card">
    <h2>使用者 Excel 匯入操作</h2>
    <p class="muted">上傳 Excel 後會先存入備查區；請先執行預掃描，確認預估新增、重複與錯誤列數後，再按「確認匯入 SQL」。若狀態為 imported_with_errors，請查看「錯誤診斷」欄與預掃描樣本。</p>
    <div class="controls">
      <div><label>匯入任務</label><select id="task" onchange="onTaskChange()"><option value="">載入中...</option></select></div>
      <div><label>匯入設定檔</label><input id="uploadConfig" value="config/excel_to_sql/vessel_activities.example.json" /></div>
      <div><label>Excel 檔案</label><input id="uploadExcel" type="file" accept=".xlsx,.xlsm,.xltx,.xltm" /></div>
      <div class="upload-actions"><button onclick="uploadExcelRecord()">上傳並建立記錄</button><button class="secondary" onclick="loadImportRecords()">重新查詢記錄</button></div>
    </div>
    <div id="uploadTaskDetails" class="review-details hidden"></div>
    <div id="previewBox" class="preview-box hidden"></div>
  </section>


  <section class="card">
    <h2>Excel 匯入記錄管理</h2>
    <section class="filters" aria-label="Excel 匯入記錄篩選">
      <div><label>檔名包含</label><input id="recordFilenameFilter" placeholder="Excel 檔名" /></div>
      <div><label>狀態</label><select id="recordStatusFilter"><option value="">全部</option><option value="uploaded">uploaded</option><option value="previewed">previewed</option><option value="imported">imported</option><option value="imported_with_errors">imported_with_errors</option><option value="deleted">deleted</option></select></div>
      <div><label>使用者包含</label><input id="recordActorFilter" placeholder="superuser 可篩選其他使用者" /></div>
      <div><label>起始時間（本機）</label><input id="recordStartFilter" type="datetime-local" step="1" /></div>
      <div><label>結束時間（本機）</label><input id="recordEndFilter" type="datetime-local" step="1" /></div>
      <button onclick="loadImportRecords()">套用記錄篩選</button>
    </section>
    <div class="pager" aria-label="Excel 匯入記錄分頁"><span id="importRecordsPageInfo" class="muted">第 1 頁</span><button id="importRecordsFirstBtn" class="secondary" type="button">首頁</button><button id="importRecordsPrevBtn" class="secondary" type="button">上一頁</button><span class="pager-jump"><label class="sr-only" for="importRecordsPageInput">Excel 匯入記錄頁數</label><input id="importRecordsPageInput" type="number" min="1" value="1" inputmode="numeric" /><button id="importRecordsGotoBtn" class="secondary" type="button">跳至頁數</button></span><button id="importRecordsNextBtn" class="secondary" type="button">下一頁</button><button id="importRecordsLastBtn" class="secondary" type="button">末頁</button></div>
    <div class="table-wrap import-records-wrap"><table id="importRecords" class="import-records-table"><colgroup><col class="date-col" /><col class="user-col" /><col class="original-file-col" /><col class="stored-file-col" /><col class="config-col" /><col class="status-col" /><col class="count-col" /><col class="count-col" /><col class="count-col" /><col class="size-col" /><col class="diagnostics-col" /><col class="actions-col" /></colgroup><thead><tr><th>日期</th><th>使用者</th><th>原始檔名</th><th>導入檔名</th><th>設定檔</th><th>狀態</th><th>新增</th><th>重複</th><th>錯誤</th><th>大小</th><th>錯誤診斷</th><th>操作</th></tr></thead><tbody></tbody></table></div>
  </section>
</main>
<script src="/static/audit_tools.js"></script>
<script src="/static/excel_to_sql_import_records.js?v=20260702-shared-page-size"></script>
</body>
</html>
