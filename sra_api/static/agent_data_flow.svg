<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" role="img" aria-labelledby="title desc">
  <title id="title">代理人資料運用處理流程</title>
  <desc id="desc">代理人可檢索的 Elasticsearch content 文本有 txt 檔與 SQL 資料兩條既有來源；Excel 先經 Excel→SQL 模組匯入 SQL，再沿用 SQL→ES 匯入流程寫入 Elasticsearch，讓 Excel 來源以 SQL 作為標準化中介而維持模組化流路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker>
    <style>
      text{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;fill:#172033}.title{font-size:29px;font-weight:800}.subtitle{font-size:15px;fill:#475467}.lane-title{font-size:18px;font-weight:800}.body{font-size:14px}.small{font-size:12px;fill:#475467}.tiny{font-size:11px;fill:#667085}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:16}.source{fill:#eff6ff;stroke:#2563eb}.sql{fill:#f0fdf4;stroke:#16a34a}.etl{fill:#ecfdf3;stroke:#027a48}.es{fill:#eef2ff;stroke:#4f46e5}.agent{fill:#fffbeb;stroke:#d97706}.note{fill:#fef3c7;stroke:#f59e0b}.module{fill:#ffffff;stroke:#d9deea;stroke-width:1.5;rx:12}.edge{stroke:#1f2937;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.edge-dashed{stroke:#64748b;stroke-width:2.4;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.edge-soft{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}.badge{font-size:12px;font-weight:700;fill:#0f172a}.badge-bg{fill:#e0f2fe;stroke:#0284c7;rx:10}
    </style>
  </defs>
  <rect width="1360" height="920" fill="#f6f7fb"/>
  <text x="680" y="44" text-anchor="middle" class="title">代理人資料運用處理流程</text>
  <text x="680" y="72" text-anchor="middle" class="subtitle">重點：content 來源模組化進 ES；上層呈現使用者提問、RAG 檢索結果與報告回傳的完整 solution</text>

  <rect x="40" y="108" width="300" height="570" rx="20" fill="#ffffff" stroke="#d9deea"/>
  <text x="190" y="140" text-anchor="middle" class="lane-title">來源資料層</text>

  <rect class="box source" x="72" y="170" width="236" height="110"/>
  <text x="190" y="204" text-anchor="middle" class="lane-title">txt 檔來源</text>
  <text x="190" y="235" text-anchor="middle" class="body">既有純文字 / 文件切片</text>
  <text x="190" y="260" text-anchor="middle" class="small">以 content 欄位成為 ES 文件</text>

  <rect class="box source" x="72" y="330" width="236" height="122"/>
  <text x="190" y="364" text-anchor="middle" class="lane-title">Excel 檔來源</text>
  <text x="190" y="394" text-anchor="middle" class="body">工作表、欄位、列資料</text>
  <text x="190" y="420" text-anchor="middle" class="small">欄名比對 / hash 去重 / audit</text>

  <rect class="box source" x="72" y="508" width="236" height="110"/>
  <text x="190" y="542" text-anchor="middle" class="lane-title">既有 SQL 資料</text>
  <text x="190" y="572" text-anchor="middle" class="body">已在 SQL Server 的來源表</text>
  <text x="190" y="598" text-anchor="middle" class="small">指定 content / title / id 欄位</text>

  <rect x="390" y="108" width="410" height="570" rx="20" fill="#ffffff" stroke="#d9deea"/>
  <text x="595" y="140" text-anchor="middle" class="lane-title">模組化匯入與標準化層</text>

  <rect class="box etl" x="430" y="170" width="300" height="110"/>
  <text x="580" y="202" text-anchor="middle" class="lane-title">txt→ES 匯入模組</text>
  <text x="580" y="232" text-anchor="middle" class="body">data_ingestion/txt_to_es</text>
  <text x="580" y="258" text-anchor="middle" class="small">解析 txt content 並建立 ES 文件</text>

  <rect class="box etl" x="430" y="330" width="300" height="122"/>
  <text x="580" y="363" text-anchor="middle" class="lane-title">Excel→SQL 機制</text>
  <text x="580" y="393" text-anchor="middle" class="body">data_ingestion/excel_to_sql</text>
  <text x="580" y="419" text-anchor="middle" class="small">欄位 mapping、日期正規化、SQL audit</text>

  <rect class="box sql" x="476" y="508" width="254" height="110"/>
  <text x="603" y="542" text-anchor="middle" class="lane-title">SQL Server 標準化中介</text>
  <text x="603" y="572" text-anchor="middle" class="body">目的資料表 / 既有來源表</text>
  <text x="603" y="598" text-anchor="middle" class="small">統一成可被 SQL→ES 讀取的 content</text>

  <rect class="box etl" x="814" y="508" width="250" height="110"/>
  <text x="939" y="542" text-anchor="middle" class="lane-title">SQL→ES 匯入模組</text>
  <text x="939" y="572" text-anchor="middle" class="body">data_ingestion/sql_to_es</text>
  <text x="939" y="598" text-anchor="middle" class="small">SELECT content 欄位並 bulk 寫入 ES</text>

  <rect class="box agent" x="750" y="110" width="390" height="112"/>
  <text x="945" y="145" text-anchor="middle" class="lane-title">LLM 多階段平行化暨智慧多流路分析框架</text>
  <text x="945" y="176" text-anchor="middle" class="body">由 ES 檢索 / 讀取 content，抽取事件與結構化欄位</text>
  <text x="945" y="202" text-anchor="middle" class="small">分析結果回寫 ES，供 RAG / Agent 報告與證據引用</text>

  <rect class="box es" x="780" y="260" width="330" height="150"/>
  <text x="945" y="296" text-anchor="middle" class="lane-title">Elasticsearch 檢索資料庫</text>
  <text x="945" y="328" text-anchor="middle" class="body">content 非結構化文本索引</text>
  <text x="945" y="356" text-anchor="middle" class="small">來源可追溯：txt / SQL / Excel→SQL</text>
  <text x="945" y="382" text-anchor="middle" class="small">後續也保存 LLM 結構化結果</text>

  <rect class="box note" x="1118" y="352" width="190" height="96"/>
  <text x="1213" y="382" text-anchor="middle" class="lane-title">使用者提問入口</text>
  <text x="1213" y="412" text-anchor="middle" class="body">提問 / 追問 / 報告需求</text>
  <text x="1213" y="434" text-anchor="middle" class="small">回覆含證據、摘要、引用</text>

  <rect class="box agent" x="1118" y="492" width="190" height="118"/>
  <text x="1213" y="526" text-anchor="middle" class="lane-title">RAG / Agent 互動</text>
  <text x="1213" y="556" text-anchor="middle" class="body">問題理解與檢索規劃</text>
  <text x="1213" y="582" text-anchor="middle" class="small">查 ES content / 結構化欄位</text>
  <text x="1213" y="604" text-anchor="middle" class="small">必要時觸發分析與報告流程</text>


  <path class="edge" d="M308 225 C350 225 388 225 430 225"/>
  <text x="369" y="207" text-anchor="middle" class="small">txt 文本</text>
  <path class="edge" d="M730 225 C760 246 765 296 780 328"/>
  <text x="775" y="264" text-anchor="middle" class="small">content 寫入 ES</text>

  <path class="edge" d="M308 391 C350 391 388 391 430 391"/>
  <text x="370" y="374" text-anchor="middle" class="small">Excel 匯入</text>
  <path class="edge" d="M580 452 C580 472 590 488 603 508"/>
  <text x="654" y="484" text-anchor="middle" class="small">建立 / 寫入 SQL</text>

  <path class="edge-soft" d="M308 563 C366 563 420 563 476 563"/>
  <text x="392" y="548" text-anchor="middle" class="small">既有 SQL 表</text>
  <path class="edge" d="M730 563 C758 563 786 563 814 563"/>
  <text x="772" y="545" text-anchor="middle" class="small">標準 content 欄位</text>
  <path class="edge" d="M939 508 C940 468 944 432 945 410"/>
  <text x="988" y="460" text-anchor="middle" class="small">SQL→ES 寫入 content</text>

  <path class="edge-dashed" d="M900 260 C890 246 884 234 878 222"/>
  <text x="850" y="244" text-anchor="middle" class="small">LLM 讀取 content</text>
  <path class="edge" d="M1018 222 C1030 236 1042 248 1055 260"/>
  <text x="1086" y="244" text-anchor="middle" class="small">結構化結果回寫 ES</text>

  <path class="edge" d="M1213 448 C1213 462 1213 478 1213 492"/>
  <text x="1248" y="470" text-anchor="middle" class="small">提問</text>
  <path class="edge-dashed" d="M1118 552 C1076 508 1046 450 1000 410"/>
  <text x="1048" y="482" text-anchor="middle" class="small">RAG 檢索 ES</text>
  <path class="edge-soft" d="M1110 410 L1118 492"/>
  <text x="1074" y="456" text-anchor="middle" class="small">回傳檢索結果</text>
  <path class="edge" d="M1308 520 C1352 486 1352 408 1308 392"/>
  <text x="1340" y="482" text-anchor="middle" class="small">回傳報告</text>
  <rect x="66" y="730" width="570" height="94" rx="14" fill="#ffffff" stroke="#d9deea"/>
  <text x="351" y="760" text-anchor="middle" class="body">設計說明</text>
  <text x="351" y="788" text-anchor="middle" class="small">content 進 ES 的主路徑不是單一來源：txt 可直接進 ES，SQL 可透過 SQL→ES 進 ES。</text>
  <text x="351" y="812" text-anchor="middle" class="small">Excel 新增後不重寫 ES 匯入邏輯，而是先導入 SQL，再重用 SQL→ES；中介 SQL 提供 audit、查詢與資料治理邊界。</text>
  <text x="351" y="836" text-anchor="middle" class="small">上層使用者提問由 RAG / Agent 向 ES 檢索並接收結果，再回傳報告給使用者；LLM 平行化分析框架維持由 ES content 驅動。</text>
</svg>
