name: SRAF OFF-1B configured TCP preflight tests

on:
  pull_request:
    paths:
      - 'tools/sraf_airgap_off1b_auto.py'
      - 'tools/sraf_airgap_off1b_api_http.py'
      - 'tools/sraf_airgap_off1b_es_https_mapping.py'
      - 'tools/sraf_airgap_off1b_es_index_discovery.py'
      - 'tests/test_sraf_airgap_off1b_es_index_discovery.py'
      - 'tests/test_sraf_airgap_off1b_es_https_mapping.py'
      - 'tests/test_sraf_airgap_off1b_api_http.py'
      - 'tools/sraf_airgap_off1_probes.py'
      - 'tests/test_sraf_airgap_off1b_auto.py'
      - 'docs/operations/sraf_airgap_off1b_configured_tcp.md'
      - '.github/workflows/sraf-airgap-off1b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-preflight:
    name: OFF-1B safe config and TCP tests (not live services)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scripts
        run: python -m compileall -q tools/sraf_airgap_off1b_auto.py tools/sraf_airgap_off1b_api_http.py tools/sraf_airgap_off1b_es_https_mapping.py tools/sraf_airgap_off1b_es_index_discovery.py tests/test_sraf_airgap_off1b_es_https_mapping.py tests/test_sraf_airgap_off1b_es_index_discovery.py tests/test_sraf_airgap_off1b_auto.py tests/test_sraf_airgap_off1b_api_http.py
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Run OFF-1B focused tests and OFF-0 contract
        run: |
          python tools/validate_sraf_airgap_off0_contract.py
          python -m pytest -q tests/test_sraf_airgap_off1b_auto.py tests/test_sraf_airgap_off1b_api_http.py tests/test_sraf_airgap_off1b_es_https_mapping.py tests/test_sraf_airgap_off1b_es_index_discovery.py tests/test_sraf_airgap_off0_contract.py
      - name: Config-only check against CI host (not SRAF environment)
        run: |
          python tools/sraf_airgap_off1b_auto.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1b_api_http.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1b_es_https_mapping.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1b_es_index_discovery.py --no-network || test "$?" -eq 2
