name: SRAF OFF-1B configured TCP preflight tests

on:
  pull_request:
    paths:
      - 'tools/sraf_airgap_off1b_auto.py'
      - 'tools/sraf_airgap_off1b_api_http.py'
      - 'tools/sraf_airgap_off1b_es_https_mapping.py'
      - 'tools/sraf_airgap_off1b_es_index_discovery.py'
      - 'tools/sraf_airgap_off1d_readiness_matrix.py'
      - 'tests/test_sraf_airgap_off1d_readiness_matrix.py'
      - 'tests/test_sraf_airgap_off1e_llm_inventory.py'
      - 'tools/sraf_airgap_off1f_llm_inference.py'
      - 'tests/test_sraf_airgap_off1f_llm_inference.py'
      - 'tools/sraf_airgap_off1f_local_attestation.py'
      - 'tests/test_sraf_airgap_off1f_local_attestation.py'
      - 'tools/sraf_airgap_off1g_sql_read.py'
      - 'tests/test_sraf_airgap_off1g_sql_read.py'
      - 'tools/sraf_airgap_off1h_worker_identity.py'
      - 'operator_e2e/requirement_e2e_support.py'
      - 'tests/test_sraf_airgap_off1h_worker_identity.py'
      - 'tools/sraf_airgap_off1i_handoff_lease.py'
      - 'tests/test_sraf_airgap_off1i_handoff_lease.py'
      - 'tools/sraf_airgap_off1j_handoff_renewal.py'
      - 'tests/test_sraf_airgap_off1j_handoff_renewal.py'
      - 'docs/operations/sraf_airgap_off1j_handoff_renewal.md'
      - 'docs/operations/sraf_airgap_off1i_handoff_lease.md'
      - 'tests/test_requirement_operator_e2e_harness.py'
      - 'docs/operations/sraf_airgap_off1h_worker_identity.md'
      - 'docs/operations/sraf_airgap_off1g_sql_read.md'
      - 'docs/operations/sraf_airgap_off1f_llm_inference.md'
      - 'docs/operations/sraf_airgap_off1e_llm_inventory.md'
      - 'docs/operations/sraf_airgap_off1d_readiness_matrix.md'
      - 'tests/test_sraf_airgap_off1b_es_https_mapping.py'
      - 'tests/test_sraf_airgap_off1b_es_index_discovery.py'
      - 'tests/test_sraf_airgap_off1b_api_http.py'
      - 'tools/sraf_airgap_off1_probes.py'
      - 'tests/test_sraf_airgap_off1b_auto.py'
      - 'docs/operations/sraf_airgap_off1b_configured_tcp.md'
      - '.github/workflows/sraf-airgap-off1b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configured-preflight:
    name: OFF-1B safe config and TCP tests (not live services)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile scripts
        run: python -m compileall -q tools/sraf_airgap_off1b_auto.py tools/sraf_airgap_off1b_api_http.py tools/sraf_airgap_off1b_es_https_mapping.py tools/sraf_airgap_off1b_es_index_discovery.py tests/test_sraf_airgap_off1b_es_https_mapping.py tests/test_sraf_airgap_off1b_es_index_discovery.py tools/sraf_airgap_off1d_readiness_matrix.py tests/test_sraf_airgap_off1d_readiness_matrix.py tests/test_sraf_airgap_off1e_llm_inventory.py tools/sraf_airgap_off1f_llm_inference.py tests/test_sraf_airgap_off1f_llm_inference.py tools/sraf_airgap_off1f_local_attestation.py tests/test_sraf_airgap_off1f_local_attestation.py tools/sraf_airgap_off1g_sql_read.py tests/test_sraf_airgap_off1g_sql_read.py tools/sraf_airgap_off1h_worker_identity.py operator_e2e/requirement_e2e_support.py tests/test_sraf_airgap_off1h_worker_identity.py tools/sraf_airgap_off1i_handoff_lease.py tests/test_sraf_airgap_off1i_handoff_lease.py tools/sraf_airgap_off1j_handoff_renewal.py tests/test_sraf_airgap_off1j_handoff_renewal.py tests/test_requirement_operator_e2e_harness.py tests/test_sraf_airgap_off1b_auto.py tests/test_sraf_airgap_off1b_api_http.py
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Run OFF-1B focused tests and OFF-0 contract
        run: |
          python tools/validate_sraf_airgap_off0_contract.py
          python -m pytest -q tests/test_sraf_airgap_off1b_auto.py tests/test_sraf_airgap_off1b_api_http.py tests/test_sraf_airgap_off1b_es_https_mapping.py tests/test_sraf_airgap_off1b_es_index_discovery.py tests/test_sraf_airgap_off1d_readiness_matrix.py tests/test_sraf_airgap_off1e_llm_inventory.py tests/test_sraf_airgap_off1f_llm_inference.py tests/test_sraf_airgap_off1f_local_attestation.py tests/test_sraf_airgap_off1g_sql_read.py tests/test_sraf_airgap_off1h_worker_identity.py tests/test_sraf_airgap_off1i_handoff_lease.py tests/test_sraf_airgap_off1j_handoff_renewal.py tests/test_sraf_airgap_off0_contract.py
          python -m pytest -q tests/test_requirement_operator_e2e_harness.py::test_worker_identity_verification tests/test_requirement_operator_e2e_harness.py::test_worker_identity_rejects_wrong_command_and_cwd
      - name: Config-only check against CI host (not SRAF environment)
        run: |
          python tools/sraf_airgap_off1b_auto.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1b_api_http.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1b_es_https_mapping.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1b_es_index_discovery.py --no-network || test "$?" -eq 2
          python tools/sraf_airgap_off1d_readiness_matrix.py || test "$?" -eq 2
