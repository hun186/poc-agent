name: SRAF Core synonym equivalence (offline)

on:
  pull_request:
    paths:
      - 'agent/es/query_terms.py'
      - 'agent/es/query_body.py'
      - 'agent/es/evidence_core/topic_match.py'
      - 'agent/es/zh_variants.py'
      - 'tests/test_sraf_synonym_equivalence.py'
      - 'tests/test_query_terms_contract.py'
      - 'tests/test_keyword_extraction_input.py'
      - '.github/workflows/sraf-synonym-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synonym-equivalence:
    name: Synonym alias and strict topic axes Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project requirements (hosted only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Compile keyword and Evidence paths
        run: |
          python -m compileall -q agent/es/query_terms.py agent/es/query_body.py agent/es/evidence_core agent/es/zh_variants.py tests/test_sraf_synonym_equivalence.py tests/test_query_terms_contract.py
      - name: Strict aliases and existing keyword contract (no live ES/LLM)
        run: |
          python -m pytest -q tests/test_sraf_synonym_equivalence.py tests/test_query_terms_contract.py tests/test_keyword_extraction_input.py tests/test_sraf_structured_evidence_time.py
