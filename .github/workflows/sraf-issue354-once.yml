name: SRAF issue354 one-time fixture bytes (temporary, branch-only)

on:
  pull_request:
    paths:
      - .github/workflows/sraf-issue354-once.yml

permissions:
  contents: read

jobs:
  derive-pinned-workbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook reader solely for semantic comparison
        run: python -m pip install 'openpyxl>=3.1.0'
      - name: Derive auditable byte patch from exact current Git workbook
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from openpyxl import load_workbook

          path = Path("operator_e2e/input/requirement_e2e_3items.xlsx")
          original = path.read_bytes()
          expected = "816ffac9039530a86955c590b0fa68830757a620229d85630f5e42c12f542403"
          assert hashlib.sha256(original).hexdigest() == expected, "source-byte-identity-mismatch"
          ns = "{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
          output = io.BytesIO()
          patched = set()
          with zipfile.ZipFile(io.BytesIO(original)) as source:
              with zipfile.ZipFile(output, "w") as target:
                  for entry in source.infolist():
                      data = source.read(entry.filename)
                      if entry.filename == "xl/worksheets/sheet1.xml":
                          root = ET.fromstring(data)
                          for row in root.findall(".//" + ns + "row"):
                              row_idx = int(row.attrib.get("r", 0))
                              if row_idx not in (2, 3, 4):
                                  continue
                              matches = [cell for cell in row.findall(ns + "c")
                                         if cell.attrib.get("r") == f"E{row_idx}"]
                              assert len(matches) == 1, "missing-or-duplicate-deadline"
                              row.remove(matches[0])
                              patched.add(row_idx)
                          ET.register_namespace("", ns[1:-1])
                          data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
                      target.writestr(entry, data)
          assert patched == {2,3,4}, "incomplete-deadline-mutation"
          updated = output.getvalue()
          old_book = load_workbook(io.BytesIO(original), read_only=True, data_only=True)
          new_book = load_workbook(io.BytesIO(updated), read_only=True, data_only=True)
          try:
              before = list(old_book.active.values)
              after = list(new_book.active.values)
          finally:
              old_book.close()
              new_book.close()
          assert len(before) == len(after) == 4
          assert len(before[0]) == len(after[0]) == 8
          assert before[0] == after[0]
          assert before[0][4] == "DeadlineDT"
          for prev, curr in zip(before[1:], after[1:]):
              assert all(prev[i] == curr[i] for i in range(8) if i != 4), "non-deadline-changed"
              assert prev[4] is not None and curr[4] is None
              assert isinstance(curr[2], str) and len(curr[2].strip()) > 20, "prompt-lost"
          assert len(set(row[0] for row in after[1:])) == 3, "duplicate-item"
          print("SRAF_ISSUE354_SOURCE_SHA256=" + hashlib.sha256(original).hexdigest())
          print("SRAF_ISSUE354_NEW_SHA256=" + hashlib.sha256(updated).hexdigest())
          print("SRAF_ISSUE354_CONTENT_PRESERVED=3")
          print("SRAF_ISSUE354_BASE64=" + base64.b64encode(updated).decode("ascii"))
          PY
