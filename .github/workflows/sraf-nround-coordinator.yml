name: SRAF request-local N-round coordinator (offline)

on:
  pull_request:
    paths:
      - 'agent/adaptive_retrieval/coordinator.py'
      - 'agent/adaptive_retrieval/next_round_gate.py'
      - 'agent/adaptive_retrieval/evidence_ledger.py'
      - 'agent/adaptive_retrieval/private_semantic_binding.py'
      - 'agent/adaptive_retrieval/trusted_execution_loop.py'
      - 'agent/adaptive_retrieval/worker_scope_binding.py'
      - 'sra_api/services/sraf_nround_claimed_job_scope.py'
      - 'sra_api/services/sraf_nround_owned_progress.py'
      - 'tests/test_sraf_nround_owned_progress.py'
      - 'tests/test_sraf_nround_reportjob_atomic_checkpoint.py'
      - 'tests/test_sraf_nround_terminal_handoff_fence.py'
      - 'docs/operations/sraf_nround_owned_progress.md'
      - 'agent/adaptive_retrieval/round_query_execution.py'
      - 'agent/adaptive_retrieval/coverage_evaluator.py'
      - 'agent/adaptive_retrieval/request_budget.py'
      - 'agent/report_agent.py'
      - 'tests/test_sraf_request_admission_budget.py'
      - 'agent/adaptive_retrieval/planner.py'
      - 'agent/es/evidence_core/builder.py'
      - 'tests/test_sraf_nround_coordinator.py'
      - 'tests/test_sraf_nround_coverage_provenance.py'
      - 'tests/test_sraf_nround_private_semantic_binding.py'
      - 'tests/test_sraf_nround_trusted_execution_loop.py'
      - 'tests/test_sraf_nround_safe_progress_sink.py'
      - 'tests/test_sraf_nround_claimed_job_runner.py'
      - 'sra_api/services/sraf_nround_claimed_job_runner.py'
      - 'docs/operations/sraf_nround_claimed_job_runner.md'
      - 'docs/operations/sraf_nround_safe_progress_sink.md'
      - 'tests/test_sraf_nround_worker_scope_binding.py'
      - 'tests/test_sraf_nround_persisted_claimed_job_scope.py'
      - 'docs/operations/sraf_nround_persisted_claimed_job_scope.md'
      - 'docs/operations/sraf_nround_worker_scope_binding.md'
      - 'docs/operations/sraf_nround_trusted_execution_loop.md'
      - 'docs/operations/sraf_nround_private_semantic_binding.md'
      - 'tests/test_sraf_nround_coverage_coordinator_bridge.py'
      - 'docs/operations/sraf_nround_request_coordinator.md'
      - '.github/workflows/sraf-nround-coordinator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinator-contract:
    name: N-round coordinator Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Compile coordinator and existing admission contracts
        run: |
          python -m compileall -q agent/adaptive_retrieval tests/test_sraf_nround_coordinator.py
      - name: Verify no-network N-round integration and prior safety regressions
        run: |
          python -m pytest -q \
            tests/test_sraf_nround_coordinator.py \
            tests/test_sraf_nround_coverage_provenance.py \
            tests/test_sraf_nround_private_semantic_binding.py \
            tests/test_sraf_nround_trusted_execution_loop.py \
            tests/test_sraf_nround_safe_progress_sink.py \
            tests/test_sraf_nround_claimed_job_runner.py \
            tests/test_sraf_nround_worker_scope_binding.py \
            tests/test_sraf_nround_persisted_claimed_job_scope.py \
            tests/test_sraf_nround_owned_progress.py \
            tests/test_sraf_nround_coverage_coordinator_bridge.py \
            tests/test_sraf_request_evidence_ledger.py \
            tests/test_sraf_nround_plan_budget_gate.py \
            tests/test_sraf_adaptive_planner_contract.py \
            tests/test_sraf_request_admission_budget.py \
            tests/test_sraf_structured_evidence_time.py \
            tests/test_sraf_shared_evidence_budget.py
      - name: Run operator combined SQLite plus N-round batch (xUnit setup collision regression)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            tests/test_sraf_nround_claimed_job_runner.py \
            tests/test_sraf_nround_owned_progress.py \
            tests/test_sraf_nround_terminal_handoff_fence.py \
            tests/test_sraf_nround_reportjob_atomic_checkpoint.py \
            tests/test_sraf_nround_safe_progress_sink.py \
            tests/test_sraf_nround_trusted_execution_loop.py \
            tests/test_sraf_nround_es_pit_adapter.py \
            tests/test_sraf_nround_es_page_fence.py
