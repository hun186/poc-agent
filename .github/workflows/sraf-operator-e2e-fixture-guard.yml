name: SRAF operator E2E canonical fixture fail-fast (synthetic only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-fixture-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies (CI only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile canonical E2E harness
        run: |
          python -m compileall -q operator_e2e/test_requirement_schedule_e2e.py
      - name: Validate OFF-0 schema-only baseline (not live)
        run: python tools/validate_sraf_airgap_off0_contract.py
      - name: Run offline synthetic operator E2E regressions
        run: |
          python -m pytest -q tests/test_requirement_operator_e2e_harness.py tests/test_requirement_operator_e2e_harness_v2.py
