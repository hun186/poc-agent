name: SRAF N-round ES page fence (offline)

on:
  pull_request:
    paths:
      - 'agent/adaptive_retrieval/es_page_fence.py'
      - 'agent/adaptive_retrieval/coordinator.py'
      - 'agent/adaptive_retrieval/request_budget.py'
      - 'tests/test_sraf_nround_es_page_fence.py'
      - 'docs/operations/sraf_nround_es_page_fence.md'
      - '.github/workflows/sraf-nround-es-page-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  es-page-contract:
    name: ES page fence Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact project runtime/test prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Compile and test both new page fence and coordinator
        run: |
          python -m compileall -q agent/adaptive_retrieval/es_page_fence.py tests/test_sraf_nround_es_page_fence.py
          python -m pytest -q tests/test_sraf_nround_es_page_fence.py tests/test_sraf_nround_coordinator.py tests/test_sraf_request_evidence_ledger.py
