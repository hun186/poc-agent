name: SRAF Report Job UI and idempotency regressions

on:
  pull_request:
    paths:
      - 'sra_api/static/report_jobs.html'
      - 'sra_api/static/report_jobs_ui.js'
      - 'sra_api/static/report_jobs_ui.css'
      - 'sra_api/static/report_jobs_auth.js'
      - 'sra_api/routers/editor.py'
      - 'sra_api/routers/report_jobs.py'
      - 'sra_api/services/report_job_service.py'
      - 'sra_api/services/report_job_store.py'
      - 'requirement_scheduler/legacy_report_job_gateway.py'
      - 'tests/test_report_jobs_ui_static.py'
      - 'tests/report_jobs_ui_flow.cjs'
      - 'tests/report_jobs_shared_auth.cjs'
      - 'tests/report_jobs_ui_fragment.cjs'
      - 'tests/test_report_jobs_api.py'
      - 'tests/test_report_jobs_shared_login_api.py'
      - 'tests/test_report_job_store.py'
      - 'tests/test_sraf_report_job_admission_cancel.py'
      - 'tests/test_sraf_report_job_browser_url.py'
      - 'tests/test_requirement_report_job_gateway.py'
      - 'tests/test_requirement_handoff_reconciliation.py'
      - '.github/workflows/sraf-report-job-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-job-ui:
    name: Report Job UI/idempotency synthetic (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies before pytest (AGENTS.md)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10' 'httpx>=0.28,<1'
      - name: Check JS/Python syntax and run UI + API regressions
        run: |
          node --check sra_api/static/report_jobs_ui.js
          node --check sra_api/static/report_jobs_auth.js
          node tests/report_jobs_shared_auth.cjs
          node tests/report_jobs_ui_fragment.cjs
          python -m compileall -q tests/test_report_jobs_ui_static.py tests/test_report_jobs_api.py tests/test_report_jobs_shared_login_api.py tests/test_sraf_report_job_admission_cancel.py tests/test_sraf_report_job_browser_url.py tests/test_requirement_report_job_gateway.py tests/test_requirement_handoff_reconciliation.py
          python -m pytest -q tests/test_report_jobs_ui_static.py tests/test_report_jobs_api.py tests/test_report_jobs_shared_login_api.py tests/test_report_job_store.py tests/test_sraf_report_job_admission_cancel.py tests/test_sraf_report_job_browser_url.py tests/test_requirement_report_job_gateway.py tests/test_requirement_handoff_reconciliation.py
