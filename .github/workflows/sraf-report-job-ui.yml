name: SRAF Report Job UI and idempotency regressions

on:
  pull_request:
    paths:
      - 'sra_api/static/report_jobs.html'
      - 'sra_api/static/editor.html'
      - 'sra_api/static/editor.css'
      - 'sra_api/static/editor_auth_nav.js'
      - 'sra_api/static/excel_global_nav.js'
      - 'sra_api/static/excel_global_nav.css'
      - 'sra_api/static/agent_data_flow.html'
      - 'sra_api/static/requirement_product_explorer.html'
      - 'sra_api/static/excel_to_sql_dashboard.html'
      - 'sra_api/static/excel_to_sql_import_center.html'
      - 'sra_api/static/excel_to_sql_task_configs.html'
      - 'sra_api/static/excel_to_sql_source_editor.html'
      - 'sra_api/static/excel_to_sql_source_dashboard.html'
      - 'sra_api/static/report_jobs_ui.js'
      - 'sra_api/static/report_jobs_ui.css'
      - 'sra_api/static/report_jobs_auth.js'
      - 'sra_api/routers/editor.py'
      - 'sra_api/routers/report_jobs.py'
      - 'sra_api/routers/nround_progress.py'
      - 'sra_api/routers/nround_admission.py'
      - 'sra_api/services/sraf_chat_deep_turn.py'
      - 'sra_api/services/sraf_chat_deep_dispatch.py'
      - 'sra_api/routers/chat.py'
      - 'sra_api/routers/export.py'
      - 'sra_api/services/sraf_session_namespace.py'
      - 'sra_api/services/turn_execution.py'
      - 'tests/test_sraf_openwebui_session.py'
      - 'sra_api/security/sraf_handoff_assertion.py'
      - 'tests/test_sraf_handoff_assertion.py'
      - 'sra_api/security/sraf_handoff_replay.py'
      - 'sra_api/security/sraf_handoff_mapping.py'
      - 'tests/test_sraf_handoff_replay_mapping.py'
      - 'sra_api/security/sraf_handoff_chat_context.py'
      - 'sra_api/security/models.py'
      - 'tests/test_sraf_handoff_chat_context.py'
      - 'tests/test_sraf_chat_deep_dispatch.py'
      - 'tests/test_sraf_chat_deep_turn.py'
      - 'sra_api/services/sraf_deep_scope_policy.py'
      - 'sra_api/services/sraf_deep_natural_scope.py'
      - 'tests/test_sraf_deep_natural_scope.py'
      - 'sra_api/services/sraf_deep_startup_config.py'
      - 'sra_api/services/sraf_deep_runtime_composition.py'
      - 'sra_api/services/report_job_worker.py'
      - 'tests/test_sraf_deep_lifespan.py'
      - 'sra_api/services/sraf_deep_grant_config.py'
      - 'sra_api/services/sraf_nround_local_models.py'
      - 'tests/test_sraf_deep_startup_config.py'
      - 'tools/sraf_deep_local_preflight.py'
      - 'tests/test_sraf_deep_local_preflight.py'
      - 'sra_api/services/sraf_deep_es_connection.py'
      - 'tests/test_sraf_deep_admission_api.py'
      - 'sra_api/services/sraf_nround_owned_progress.py'
      - 'sra_api/main.py'
      - 'tests/test_sraf_nround_progress_api.py'
      - 'sra_api/services/report_job_service.py'
      - 'sra_api/services/report_job_store.py'
      - 'requirement_scheduler/legacy_report_job_gateway.py'
      - 'tests/test_report_jobs_ui_static.py'
      - 'tests/report_jobs_ui_flow.cjs'
      - 'tests/sraf_shared_nav_flow.cjs'
      - 'tests/sraf_editor_nav_behavior.cjs'
      - 'tests/test_editor_auth_ui_static.py'
      - 'tests/test_sraf_shared_navigation_static.py'
      - 'tests/test_excel_to_sql_dashboard_static.py'
      - 'tests/test_requirement_product_explorer_static.py'
      - 'tests/report_jobs_shared_auth.cjs'
      - 'tests/report_jobs_ui_fragment.cjs'
      - 'tests/test_report_jobs_api.py'
      - 'tests/test_report_jobs_shared_login_api.py'
      - 'tests/test_report_job_store.py'
      - 'tests/test_sraf_report_job_admission_cancel.py'
      - 'tests/test_sraf_report_job_browser_url.py'
      - 'tests/test_requirement_report_job_gateway.py'
      - 'tests/test_requirement_handoff_reconciliation.py'
      - '.github/workflows/sraf-report-job-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-job-ui:
    name: Report Job UI/idempotency synthetic (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies before pytest (AGENTS.md)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10' 'httpx>=0.28,<1'
      - name: Check JS/Python syntax and run UI + API regressions
        run: |
          node --check sra_api/static/report_jobs_ui.js
          node --check sra_api/static/report_jobs_auth.js
          node --check sra_api/static/excel_global_nav.js
          node --check sra_api/static/editor_auth_nav.js
          node tests/sraf_editor_nav_behavior.cjs
          node tests/sraf_shared_nav_flow.cjs
          node tests/report_jobs_shared_auth.cjs
          node tests/report_jobs_ui_fragment.cjs
          python -m compileall -q tests/test_editor_auth_ui_static.py tests/test_sraf_shared_navigation_static.py tests/test_excel_to_sql_dashboard_static.py tests/test_requirement_product_explorer_static.py tests/test_report_jobs_ui_static.py tests/test_report_jobs_api.py tests/test_report_jobs_shared_login_api.py tests/test_sraf_report_job_admission_cancel.py tests/test_sraf_report_job_browser_url.py tests/test_requirement_report_job_gateway.py tests/test_requirement_handoff_reconciliation.py
          python -m pytest -q tests/test_sraf_deep_lifespan.py tests/test_sraf_deep_startup_config.py tests/test_sraf_deep_local_preflight.py tests/test_sraf_deep_scope_policy.py tests/test_sraf_deep_natural_scope.py tests/test_sraf_nround_local_models.py tests/test_sraf_deep_admission_api.py tests/test_sraf_chat_deep_turn.py tests/test_sraf_chat_deep_dispatch.py tests/test_sraf_openwebui_session.py tests/test_sraf_handoff_assertion.py tests/test_sraf_handoff_replay_mapping.py tests/test_sraf_handoff_chat_context.py tests/test_sraf_nround_progress_api.py tests/test_editor_auth_ui_static.py tests/test_sraf_shared_navigation_static.py tests/test_excel_to_sql_dashboard_static.py tests/test_requirement_product_explorer_static.py tests/test_report_jobs_ui_static.py tests/test_report_jobs_api.py tests/test_report_jobs_shared_login_api.py tests/test_report_job_store.py tests/test_sraf_report_job_admission_cancel.py tests/test_sraf_report_job_browser_url.py tests/test_requirement_report_job_gateway.py tests/test_requirement_handoff_reconciliation.py
