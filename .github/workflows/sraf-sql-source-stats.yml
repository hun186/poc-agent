name: SRAF SQL source statistics regressions

on:
  pull_request:
    paths:
      - 'data_ingestion/excel_to_sql/table_editor.py'
      - 'sra_api/routers/excel_to_sql.py'
      - 'sra_api/static/excel_to_sql_source_dashboard_app.js'
      - 'sra_api/static/excel_to_sql_source_dashboard.html'
      - 'tests/test_excel_to_sql_source_editor.py'
      - 'tests/test_excel_to_sql_dashboard_static.py'
      - '.github/workflows/sraf-sql-source-stats.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-source-stats:
    name: SQL stats read-only synthetic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies before pytest (AGENTS.md)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10' 'httpx>=0.28,<1'
      - name: Check syntax
        run: python -m compileall -q data_ingestion/excel_to_sql/table_editor.py tests/test_excel_to_sql_source_editor.py
      - name: Check source dashboard JavaScript syntax
        run: node --check sra_api/static/excel_to_sql_source_dashboard_app.js
      - name: Run source-editor API and dashboard regressions (no live SQL)
        run: python -m pytest -q tests/test_excel_to_sql_source_editor.py tests/test_excel_to_sql_dashboard_static.py
