name: SRAF N-round durable checkpoint (offline)

on:
  pull_request:
    paths:
      - 'agent/adaptive_retrieval/job_checkpoint.py'
      - 'agent/adaptive_retrieval/coordinator.py'
      - 'agent/adaptive_retrieval/evidence_ledger.py'
      - 'tests/test_sraf_nround_checkpoint.py'
      - 'docs/operations/sraf_nround_checkpoint.md'
      - '.github/workflows/sraf-nround-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-fence:
    name: SQLite N-round checkpoint Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Verify compilation and atomic offline checkpoint behavior
        run: |
          python -m compileall -q agent/adaptive_retrieval/job_checkpoint.py tests/test_sraf_nround_checkpoint.py
          python -m pytest -q tests/test_sraf_nround_checkpoint.py
