name: SRAF Report Evidence count trace (synthetic)

on:
  pull_request:
    paths:
      - 'agent/report_agent.py'
      - 'agent/utils/report_evidence_trace.py'
      - 'tests/test_sraf_report_evidence_trace.py'
      - '.github/workflows/sraf-report-evidence-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-evidence:
    name: Report Evidence trace Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies before running tests (AGENTS.md)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Compile Report Agent and tests
        run: |
          python -m compileall -q agent/report_agent.py agent/utils/report_evidence_trace.py tests/test_sraf_report_evidence_trace.py
      - name: Run report LLM boundary and incomplete-search synthetic tests
        run: |
          python -m pytest -q tests/test_sraf_report_evidence_trace.py tests/test_sraf_report_search_completeness.py tests/test_sraf_evidence_trace.py tests/test_sraf_bounded_evidence_rescue.py tests/test_sraf_source_evidence_refill.py tests/test_sraf_structured_evidence_time.py
