name: SRAF OFF-2 pinned runtime-file inventory (partial only)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project dependencies (CI only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile OFF-2 read-only verifier
        run: |
          python -m compileall -q tools/sraf_airgap_off2_manifest_check.py tests/test_sraf_airgap_off2_manifest_check.py tools/sraf_airgap_off2_requirements_audit.py tests/test_sraf_airgap_off2_requirements_audit.py tools/sraf_airgap_off2_wheel_files.py tests/test_sraf_airgap_off2_wheel_files.py tools/sraf_airgap_off2_linux_target.py tools/sraf_airgap_off2_elf_needed.py tools/sraf_airgap_off2_runtime_deps.py tools/sraf_airgap_off2_user_site.py tools/sraf_airgap_off2_runtime_launchers.py tools/sraf_local_deploy_quickcheck.py tests/test_sraf_local_deploy_quickcheck.py tests/test_sraf_airgap_off2_user_site.py tests/test_sraf_airgap_off2_runtime_launchers.py tests/test_sraf_airgap_off2_linux_target.py tests/test_sraf_airgap_off2_runtime_deps.py tools/sraf_operator_diagnostics.py tools/sraf_diagnostics_report.py tests/test_sraf_operator_diagnostics.py
          python tools/sraf_airgap_off2_manifest_check.py --help
          bash -n scripts/diagnostics/run_sraf_airgap_off2_verify.sh
      - name: Validate OFF-0 baseline (schema-only)
        run: python tools/validate_sraf_airgap_off0_contract.py
      - name: Verify synthetic pinned-file cases (not a live package or airgap)
        run: |
          python -m pytest -q tests/test_sraf_airgap_off2_manifest_check.py tests/test_sraf_airgap_off2_requirements_audit.py tests/test_sraf_airgap_off2_wheel_files.py tests/test_sraf_airgap_off2_linux_target.py tests/test_sraf_airgap_off2_runtime_deps.py tests/test_sraf_airgap_off2_user_site.py tests/test_sraf_airgap_off2_runtime_launchers.py tests/test_sraf_local_deploy_quickcheck.py tests/test_sraf_airgap_off2_shell_verify.py tests/test_sraf_airgap_off0_contract.py tests/test_sraf_airgap_off2_policy_coverage.py tests/test_deployment_manifest.py

  target-python310-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install project dependencies (CI only; not target host)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Python 3.10 syntax and OFF-2 operator target regressions
        run: |
          python -m compileall -q tools/sraf_airgap_off2_linux_target.py tools/sraf_airgap_off2_elf_needed.py tools/sraf_airgap_off2_runtime_deps.py tools/sraf_airgap_off2_user_site.py tools/sraf_airgap_off2_runtime_launchers.py tools/sraf_local_deploy_quickcheck.py tests/test_sraf_local_deploy_quickcheck.py tests/test_sraf_airgap_off2_user_site.py tests/test_sraf_airgap_off2_runtime_launchers.py tests/test_sraf_airgap_off2_linux_target.py tests/test_sraf_airgap_off2_runtime_deps.py tools/sraf_operator_diagnostics.py tools/sraf_diagnostics_report.py tests/test_sraf_operator_diagnostics.py
          python -m pytest -q tests/test_sraf_airgap_off2_linux_target.py tests/test_sraf_airgap_off2_runtime_deps.py tests/test_sraf_airgap_off2_user_site.py tests/test_sraf_airgap_off2_runtime_launchers.py tests/test_sraf_local_deploy_quickcheck.py tests/test_sraf_airgap_off3_dispatch.py tests/test_sraf_airgap_off0_contract.py tests/test_sraf_operator_diagnostics.py
