name: SRAF OFF-1 unified offline hub

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install project dependencies (CI only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile and inspect offline operator entry
        run: |
          python -m compileall -q tools/sraf_airgap_off1_hub.py tools/sraf_airgap_off1_es_hub.py tools/sraf_airgap_off1_sql_hub.py tools/sraf_airgap_off1_text_report.py
          python tools/sraf_airgap_off1_hub.py --help
          bash -n run_sraf_airgap_off1_diagnose.sh
      - name: Validate OFF-0 schema-only contract (not runtime acceptance)
        run: python tools/validate_sraf_airgap_off0_contract.py
      - name: Run synthetic no-network regression suite
        run: |
          python -m pytest -q tests/test_sraf_airgap_off1_hub.py tests/test_sraf_airgap_report_jobs_acceptance.py tests/test_sraf_airgap_off1_diagnose_launcher.py tests/test_sraf_airgap_off1h_worker_identity.py tests/test_sraf_airgap_off1_es_hub.py tests/test_sraf_airgap_off1b_es_https_mapping.py tests/test_sraf_airgap_off1_sql_hub.py tests/test_sraf_airgap_off1g_sql_read.py tests/test_sraf_airgap_off1_text_report.py
