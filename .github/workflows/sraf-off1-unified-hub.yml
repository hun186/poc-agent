name: SRAF OFF-1 unified offline hub

on:
  pull_request:
    paths:
      - 'tools/sraf_airgap_off1_hub.py'
      - 'tests/test_sraf_airgap_off1_hub.py'
      - 'docs/operations/sraf_airgap_off1_hub.md'
      - '.github/workflows/sraf-off1-unified-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install project dependencies (CI only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and inspect offline operator entry
        run: |
          python -m compileall -q tools/sraf_airgap_off1_hub.py
          python tools/sraf_airgap_off1_hub.py --help
      - name: Run synthetic no-network regression suite
        run: |
          python -m pytest -q tests/test_sraf_airgap_off1_hub.py tests/test_sraf_airgap_report_jobs_acceptance.py
