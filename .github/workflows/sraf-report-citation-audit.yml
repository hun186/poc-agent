name: SRAF report citation labels (synthetic)

on:
  pull_request:
    paths:
      - 'agent/utils/report_citation_audit.py'
      - 'tests/test_sraf_report_citation_audit.py'
      - '.github/workflows/sraf-report-citation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-label-audit:
    name: Report citation labels Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Compile audit and tests
        run: python -m compileall -q agent/utils/report_citation_audit.py tests/test_sraf_report_citation_audit.py
      - name: Verify citation boundaries (no ES or LLM)
        run: python -m pytest -q tests/test_sraf_report_citation_audit.py
