name: SRAF bounded Evidence rescue (offline)

on:
  pull_request:
    paths:
      - 'agent/es/evidence_core/**'
      - 'agent/es/query_body.py'
      - 'tests/test_sraf_bounded_evidence_rescue.py'
      - 'tests/test_sraf_structured_evidence_time.py'
      - 'tests/test_sraf_date_evidence_refill.py'
      - 'tests/test_sraf_synonym_equivalence.py'
      - '.github/workflows/sraf-bounded-evidence-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-evidence-rescue:
    name: Bounded Evidence rescue Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project dependencies (hosted only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Compile Evidence and query modules
        run: |
          python -m compileall -q agent/es/evidence_core agent/es/query_body.py tests/test_sraf_bounded_evidence_rescue.py
      - name: Run bounded, date-safe and existing topic regressions (offline)
        run: |
          python -m pytest -q tests/test_sraf_bounded_evidence_rescue.py tests/test_sraf_structured_evidence_time.py tests/test_sraf_date_evidence_refill.py tests/test_sraf_synonym_equivalence.py tests/test_query_terms_contract.py
