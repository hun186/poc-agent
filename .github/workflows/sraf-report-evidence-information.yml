name: SRAF report Evidence information signal (offline)

on:
  pull_request:
    paths:
      - 'agent/utils/report_evidence_information.py'
      - 'tests/test_sraf_report_evidence_information.py'
      - '.github/workflows/sraf-report-evidence-information.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-information:
    name: Report Evidence information Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Compile policy and tests
        run: python -m compileall -q agent/utils/report_evidence_information.py tests/test_sraf_report_evidence_information.py
      - name: Run synthetic information warning contract
        run: python -m pytest -q tests/test_sraf_report_evidence_information.py
