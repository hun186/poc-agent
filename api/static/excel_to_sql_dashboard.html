<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel→SQL 匯入 SQL 監控儀表板</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --card:#fff; --line:#d9deea; --text:#172033; --muted:#667085; --ok:#027a48; --warn:#b54708; --bad:#b42318; --info:#175cd3; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { padding:20px 28px; background:#111827; color:white; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size:22px; }
    main { padding:24px; max-width:1400px; margin:0 auto; }
    .controls, .filters, .cards, .grid { display:grid; gap:16px; }
    .controls { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items:end; margin-bottom:18px; }
    .filters { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items:end; margin:12px 0 14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
    .cards { grid-template-columns: repeat(5, minmax(140px, 1fr)); margin-bottom:16px; }
    .metric { font-size:28px; font-weight:700; margin-top:6px; }
    .muted { color:var(--muted); font-size:13px; }
    label { font-weight:600; font-size:13px; display:block; margin-bottom:6px; }
    input, select { width:100%; box-sizing:border-box; padding:10px 11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:white; }
    .dropdown-filter { position:relative; }
    .multi-select { position:relative; }
    .multi-select summary { list-style:none; width:100%; box-sizing:border-box; padding:10px 36px 10px 11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:white; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .multi-select summary::-webkit-details-marker { display:none; }
    .multi-select summary::after { content:'▾'; position:absolute; right:12px; top:10px; color:var(--muted); }
    .multi-select[open] summary { border-bottom-left-radius:0; border-bottom-right-radius:0; }
    .multi-select-menu { position:absolute; z-index:20; top:100%; left:0; right:0; max-height:260px; overflow:auto; padding:8px; border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px; background:white; box-shadow:0 10px 24px rgba(16,24,40,.16); }
    .multi-select-option { display:flex; gap:8px; align-items:flex-start; padding:7px 6px; border-radius:8px; font-size:13px; line-height:1.35; cursor:pointer; word-break:break-word; }
    .multi-select-option:hover { background:#f8fafc; }
    .multi-select-option input { width:auto; margin-top:2px; flex:0 0 auto; }
    button { padding:10px 14px; border:0; border-radius:10px; background:#2563eb; color:white; font-weight:700; cursor:pointer; }
    button.secondary { background:#475467; }
    button.ghost { background:#e2e8f0; color:#172033; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top; }
    th { color:#344054; font-size:12px; background:#f9fafb; position:sticky; top:0; }
    .table-wrap { overflow:auto; max-height:520px; border:1px solid var(--line); border-radius:12px; }
    .grid { grid-template-columns: 1fr 1.5fr; }
    .status { display:inline-block; border-radius:999px; padding:2px 8px; font-weight:700; font-size:12px; background:#eef4ff; color:var(--info); }
    .status.inserted { background:#ecfdf3; color:var(--ok); }
    .status.duplicate, .status.header_smart_match { background:#fffaeb; color:var(--warn); }
    .status.failed { background:#fef3f2; color:var(--bad); }
    .error { background:#fef3f2; border:1px solid #fecdca; color:var(--bad); padding:12px; border-radius:12px; margin:12px 0; white-space:pre-wrap; }
    .hidden { display:none; }
    .chart-card { border:1px solid var(--line); border-radius:12px; padding:12px; background:#f8fafc; margin:8px 0 14px; }
    .chart-title { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .chart-controls { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
    .chart-controls label { margin-bottom:4px; }
    .chart-controls select { min-width:150px; }
    .audit-chart { width:100%; min-height:240px; display:block; }
    .chart-axis { stroke:#cbd5e1; stroke-width:1; }
    .chart-grid { stroke:#e2e8f0; stroke-width:1; }
    .chart-line { fill:none; stroke:#2563eb; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .chart-point { fill:#2563eb; stroke:white; stroke-width:2; }
    .chart-label { fill:#475467; font-size:11px; }
    .chart-empty { color:var(--muted); padding:48px 0; text-align:center; }
    .recent-toolbar { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin:10px 0 12px; }
    .pager { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .pager button { padding:7px 10px; }
    #recent th.payload-col, #recent td.payload-col { width:46%; min-width:460px; }
    .json-view { white-space:pre-wrap; word-break:break-word; margin:0; min-width:420px; max-width:none; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.5; }
    .json-key { color:#7c3aed; font-weight:700; }
    .json-string { color:#047857; }
    .json-number, .json-boolean { color:#b45309; }
    .json-null { color:#64748b; font-style:italic; }
    pre { white-space:pre-wrap; word-break:break-word; margin:0; }
    @media (max-width: 900px) { .controls, .cards, .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Excel→SQL 匯入 SQL 監控儀表板</h1>
      <div class="muted" style="color:#cbd5e1;">追蹤 Excel→SQL 匯入批次、去重、欄名智慧比對與失敗資料列</div>
    </div>
    <div>
      <button class="secondary" onclick="location.href='/editor'">前往登入 / 編輯器</button>
    </div>
  </header>
  <main>
    <section class="card controls">
      <div><label>監控任務</label><select id="task" onchange="onTaskChange()"><option value="">載入中...</option></select></div>
      <div><label>設定檔路徑</label><input id="config" value="config/excel_to_sql/vessel_activities.example.json" /></div>
      <div><label>起始時間（本機）</label><input id="startTs" type="datetime-local" step="1" /></div>
      <div><label>結束時間（本機）</label><input id="endTs" type="datetime-local" step="1" /></div>
      <div><label>回看天數（未填起迄時）</label><input id="days" type="number" min="1" max="365" value="14" /></div>
      <div><label>列數上限</label><input id="limit" type="number" min="1" max="1000" value="100" /></div>
      <button onclick="refreshDashboardNow()">重新整理</button>
      <button class="ghost" onclick="resetDefaultWindow()">預設近14天</button>
    </section>

    <div id="msg" class="error hidden"></div>

    <section class="cards" id="cards"></section>

    <section class="grid">
      <div class="card">
        <h2>每日狀態</h2>
        <div class="table-wrap"><table id="daily"><thead><tr><th>日期</th><th>狀態</th><th>筆數</th></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="card">
        <h2>檔案處理彙總</h2>
        <div class="table-wrap"><table id="files"><thead><tr><th>來源檔</th><th>最後處理</th><th>新增</th><th>重複</th><th>失敗</th><th>欄名比對</th></tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <section class="card" style="margin-top:16px;">
      <h2>最近 audit 事件</h2>
      <p class="muted" id="timeBasis">audit 時間以本機時間顯示；UTC 原始值會以灰字附註。</p>
      <section class="filters" aria-label="最近 audit 事件篩選">
        <div><label>audit 狀態</label><select id="statusFilter"><option value="">全部</option><option value="inserted">inserted</option><option value="duplicate">duplicate</option><option value="failed">failed</option><option value="header_smart_match">header_smart_match</option><option value="sql_deleted">sql_deleted</option><option value="sql_delete_not_found">sql_delete_not_found</option></select></div>
        <div><label>來源檔包含</label><input id="sourceFileFilter" placeholder="例如 .xlsx 或檔名片段" /></div>
        <div class="dropdown-filter"><label for="destinationTableSummary">目的地 table</label><details id="destinationTableDropdown" class="multi-select"><summary id="destinationTableSummary">全部目的地 table</summary><div id="destinationTableFilter" class="multi-select-menu" role="listbox" aria-label="目的地 table 篩選"><div class="muted">載入後可選擇</div></div></details><div class="muted">點開選單選擇 table；選取後會自動收合</div></div>
        <div><label>列號</label><input id="rowNoFilter" type="number" min="1" placeholder="Excel row_no" /></div>
        <div><label>訊息包含</label><input id="messageFilter" placeholder="錯誤訊息 / 智慧比對" /></div>
        <div><label>hash 包含</label><input id="hashFilter" placeholder="hash_value 片段" /></div>
        <div><label>payload 關鍵字</label><input id="payloadFilter" placeholder="payload JSON 文字" /></div>
        <button onclick="applyAuditFilters()">套用篩選</button>
        <button class="secondary" onclick="clearAuditFilters()">清空 audit 篩選</button>
      </section>
      <div class="chart-card">
        <div class="chart-title">
          <div>
            <strong id="filteredSeriesTitle">audit 筆數統計曲線（套用目前篩選）</strong>
            <div class="muted" id="filteredDailySummary">尚未載入</div>
          </div>
          <div class="chart-controls" aria-label="曲線圖時間區間設定">
            <div>
              <label for="chartBucket">曲線圖時間區間</label>
              <select id="chartBucket">
                <option value="hour">每小時</option>
                <option value="6_hours">每 6 小時</option>
                <option value="12_hours">每 12 小時</option>
                <option value="day" selected>每日</option>
                <option value="week">每週</option>
                <option value="month">每月</option>
              </select>
            </div>
          </div>
        </div>
        <div id="filteredDailyChart" class="chart-empty">尚未載入圖表</div>
      </div>
      <div class="recent-toolbar">
        <div class="muted" id="recentPageInfo">第 1 頁</div>
        <div class="pager">
          <button class="ghost" id="recentPrevBtn" onclick="changeRecentPage(-1)">上一頁</button>
          <button class="ghost" id="recentNextBtn" onclick="changeRecentPage(1)">下一頁</button>
        </div>
      </div>
      <div class="table-wrap"><table id="recent"><thead><tr><th>時間（本機）</th><th>狀態</th><th>檔案</th><th>列號</th><th>訊息</th><th>操作</th><th class="payload-col">payload</th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>
<script>
const tokenKey = 'sra_editor_token';
const state = { recentPage: 1, recentTotal: 0, recentPageSize: 100 };
function $(id) { return document.getElementById(id); }
function escapeHtml(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusBadge(s) { return `<span class="status ${escapeHtml(s)}">${escapeHtml(s || '(empty)')}</span>`; }
function showError(text) { const el=$('msg'); if (!text) { el.classList.add('hidden'); el.textContent=''; } else { el.classList.remove('hidden'); el.textContent=text; } }
function metric(summary, status) { const row = summary.find(x => x.status === status); return Number(row?.count || 0); }
function renderCards(data) {
  const inserted = metric(data.summary, 'inserted');
  const duplicate = metric(data.summary, 'duplicate');
  const failed = metric(data.summary, 'failed');
  const smart = metric(data.summary, 'header_smart_match');
  const total = data.summary.reduce((a, x) => a + Number(x.count || 0), 0);
  $('cards').innerHTML = [
    ['總事件', total, 'audit rows'], ['新增', inserted, 'inserted'], ['重複略過', duplicate, 'duplicate'], ['失敗', failed, 'failed'], ['欄名智慧比對', smart, 'header_smart_match']
  ].map(([label, value, cls]) => `<div class="card"><div class="muted">${label}</div><div class="metric ${cls}">${value}</div></div>`).join('');
}
function fillTable(id, rows, render) { document.querySelector(`#${id} tbody`).innerHTML = rows.map(render).join('') || '<tr><td colspan="99" class="muted">無資料</td></tr>'; }
function authToken() { return localStorage.getItem(tokenKey) || ''; }
function pad2(v) { return String(v).padStart(2, '0'); }
function toLocalInputValue(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }
function resetDefaultWindow() {
  const end = new Date();
  const start = new Date(end.getTime() - 14 * 24 * 60 * 60 * 1000);
  $('startTs').value = toLocalInputValue(start);
  $('endTs').value = toLocalInputValue(end);
  $('days').value = 14;
  $('chartBucket').value = 'day';
}
function localInputToUtcIso(id) { const v = $(id).value; return v ? new Date(v).toISOString() : ''; }
function updateEndTsToNow() {
  const endInput = $('endTs');
  const now = new Date(Date.now() + 60 * 1000);
  const current = endInput.value ? new Date(endInput.value) : null;
  if (!current || Number.isNaN(current.getTime()) || current.getTime() < now.getTime()) {
    endInput.value = toLocalInputValue(now);
  }
}
function refreshDashboardNow() { updateEndTsToNow(); loadDashboard(); }
function normalizeAuditUtc(text) {
  const raw = String(text || '');
  if (!raw) return null;
  const trimmed = raw.replace(/(\.\d{3})\d+/, '$1');
  return /[zZ]|[+-]\d\d:?\d\d$/.test(trimmed) ? trimmed : trimmed + 'Z';
}
function formatAuditTime(value) {
  const raw = String(value || '');
  const normalized = normalizeAuditUtc(raw);
  if (!normalized) return '';
  const local = new Date(normalized);
  if (Number.isNaN(local.getTime())) return escapeHtml(raw);
  return `<div>${escapeHtml(local.toLocaleString())}</div><div class="muted">UTC：${escapeHtml(raw)}</div>`;
}
function resetRecentPage() { state.recentPage = 1; }
function applyAuditFilters() { resetRecentPage(); updateEndTsToNow(); loadDashboard(); }
function selectedValues(id) {
  const el = $(id);
  if (el.selectedOptions) return Array.from(el.selectedOptions).map(option => option.value).filter(Boolean);
  return Array.from(el.querySelectorAll('input[type="checkbox"]:checked')).map(input => input.value).filter(Boolean);
}
function updateDestinationTableSummary() {
  const values = selectedValues('destinationTableFilter');
  $('destinationTableSummary').textContent = values.length ? `已選 ${values.length} 個 table：${values.join(', ')}` : '全部目的地 table';
}
function clearAuditFilters() { ['statusFilter','sourceFileFilter','rowNoFilter','messageFilter','hashFilter','payloadFilter'].forEach(id => { $(id).value = ''; }); $('destinationTableFilter').querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = false; }); updateDestinationTableSummary(); applyAuditFilters(); }
function renderDestinationTableOptions(options) {
  const el = $('destinationTableFilter');
  const selected = new Set(selectedValues('destinationTableFilter'));
  const values = Array.from(new Set((options || []).map(value => String(value || '').trim()).filter(Boolean)));
  selected.forEach(value => { if (value && !values.includes(value)) values.push(value); });
  if (!values.length) { el.innerHTML = '<div class="muted">無可選 table</div>'; updateDestinationTableSummary(); return; }
  el.innerHTML = values.map((value, index) => `<label class="multi-select-option"><input type="checkbox" value="${escapeHtml(value)}"${selected.has(value) ? ' checked' : ''} aria-label="目的地 table ${index + 1}"><span>${escapeHtml(value)}</span></label>`).join('');
  updateDestinationTableSummary();
}
function closeDestinationTableDropdown() { $('destinationTableDropdown').open = false; }
function changeRecentPage(delta) {
  const next = state.recentPage + delta;
  const maxPage = Math.max(1, Math.ceil(state.recentTotal / Math.max(state.recentPageSize, 1)));
  if (next < 1 || next > maxPage) return;
  state.recentPage = next;
  loadDashboard();
}
function updateRecentPager(data) {
  const paging = data.recent_paging || {};
  state.recentPage = Number(paging.page || state.recentPage || 1);
  state.recentPageSize = Number(paging.page_size || $('limit').value || 100);
  state.recentTotal = Number(paging.total || (data.recent || []).length || 0);
  const totalPages = Math.max(1, Math.ceil(state.recentTotal / Math.max(state.recentPageSize, 1)));
  const start = state.recentTotal ? ((state.recentPage - 1) * state.recentPageSize + 1) : 0;
  const end = Math.min(state.recentTotal, state.recentPage * state.recentPageSize);
  $('recentPageInfo').textContent = `第 ${state.recentPage} / ${totalPages} 頁，顯示 ${start}-${end} 筆，共 ${state.recentTotal} 筆`;
  $('recentPrevBtn').disabled = state.recentPage <= 1;
  $('recentNextBtn').disabled = state.recentPage >= totalPages;
}
function renderJson(value, level = 0) {
  const indent = '  '.repeat(level);
  const nextIndent = '  '.repeat(level + 1);
  if (value === null) return '<span class="json-null">null</span>';
  if (Array.isArray(value)) {
    if (!value.length) return '[]';
    return '[\n' + value.map(item => nextIndent + renderJson(item, level + 1)).join(',\n') + '\n' + indent + ']';
  }
  if (typeof value === 'object') {
    const entries = Object.entries(value);
    if (!entries.length) return '{}';
    return '{\n' + entries.map(([key, val]) => `${nextIndent}<span class="json-key">"${escapeHtml(key)}"</span>: ${renderJson(val, level + 1)}`).join(',\n') + '\n' + indent + '}';
  }
  if (typeof value === 'string') return `<span class="json-string">${escapeHtml(JSON.stringify(value))}</span>`;
  if (typeof value === 'number' || typeof value === 'boolean') return `<span class="json-number">${escapeHtml(value)}</span>`;
  return escapeHtml(JSON.stringify(value));
}
function payloadCell(payload) {
  const value = (payload === undefined || payload === '') ? {} : payload;
  return `<pre class="json-view">${renderJson(value)}</pre>`;
}
function normalizeBucketLabel(value, bucket) {
  const text = String(value || '');
  if (!text) return '';
  if (bucket === 'hour' || bucket === '6_hours' || bucket === '12_hours') return text.replace('T', ' ').slice(0, 16);
  if (bucket === 'month') return text.slice(0, 7);
  return text.slice(0, 10);
}
function compactBucketLabel(label, bucket) {
  if (bucket === 'hour' || bucket === '6_hours' || bucket === '12_hours') return label.slice(5, 16);
  if (bucket === 'month') return label;
  return label.slice(5);
}
function renderFilteredDailyChart(rows, bucket = 'day', bucketLabel = '每日') {
  const data = (rows || []).map(row => ({ bucket: normalizeBucketLabel(row.bucket_start ?? row.day, bucket), count: Number(row.count || 0) })).filter(row => row.bucket);
  const total = data.reduce((sum, row) => sum + row.count, 0);
  $('filteredSeriesTitle').textContent = `${bucketLabel || '每日'} audit 筆數（套用目前篩選）`;
  $('filteredDailySummary').textContent = data.length ? `${data.length} 個區間，共 ${total} 筆` : '無符合篩選的 audit 事件';
  if (!data.length) {
    $('filteredDailyChart').className = 'chart-empty';
    $('filteredDailyChart').textContent = '目前篩選條件下無資料';
    return;
  }
  const width = 920;
  const height = 260;
  const margin = { top: 18, right: 22, bottom: 46, left: 52 };
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;
  const maxCount = Math.max(...data.map(row => row.count), 1);
  const x = index => margin.left + (data.length === 1 ? innerWidth / 2 : (index * innerWidth) / (data.length - 1));
  const y = count => margin.top + innerHeight - (count / maxCount) * innerHeight;
  const points = data.map((row, index) => `${x(index)},${y(row.count)}`).join(' ');
  const yTicks = [0, Math.ceil(maxCount / 2), maxCount].filter((value, index, arr) => arr.indexOf(value) === index);
  const maxLabels = 7;
  const labelEvery = Math.max(1, Math.ceil(data.length / maxLabels));
  const grid = yTicks.map(value => {
    const yy = y(value);
    return `<line class="chart-grid" x1="${margin.left}" y1="${yy}" x2="${width - margin.right}" y2="${yy}"></line><text class="chart-label" x="${margin.left - 8}" y="${yy + 4}" text-anchor="end">${escapeHtml(value)}</text>`;
  }).join('');
  const labels = data.map((row, index) => {
    if (index % labelEvery !== 0 && index !== data.length - 1) return '';
    return `<text class="chart-label" x="${x(index)}" y="${height - 18}" text-anchor="middle">${escapeHtml(compactBucketLabel(row.bucket, bucket))}</text>`;
  }).join('');
  const circles = data.map((row, index) => `<circle class="chart-point" cx="${x(index)}" cy="${y(row.count)}" r="4"><title>${escapeHtml(row.bucket)}：${escapeHtml(row.count)} 筆</title></circle>`).join('');
  $('filteredDailyChart').className = '';
  $('filteredDailyChart').innerHTML = `<svg class="audit-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(bucketLabel || '每日')} audit 筆數曲線圖" preserveAspectRatio="none">${grid}<line class="chart-axis" x1="${margin.left}" y1="${margin.top + innerHeight}" x2="${width - margin.right}" y2="${margin.top + innerHeight}"></line><line class="chart-axis" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${margin.top + innerHeight}"></line><polyline class="chart-line" points="${points}"></polyline>${circles}${labels}</svg>`;
}
function onTaskChange() { if ($('task').value) $('config').value = $('task').value; applyAuditFilters(); }
async function loadTasks() {
  const token = authToken();
  if (!token) { showError('請先到 /editor 登入；本儀表板會沿用 sra_editor_token。'); return; }
  const res = await fetch('/v1/excel-to-sql/dashboard-tasks', { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) return;
  const data = await res.json();
  const tasks = data.tasks || [];
  $('task').innerHTML = tasks.length
    ? tasks.map(t => `<option value="${escapeHtml(t.config_path)}">${escapeHtml(t.name)} (${escapeHtml(t.config_path)})</option>`).join('')
    : '<option value="">未找到 dashboard.enabled=true 的任務</option>';
  if (tasks.length) $('config').value = tasks[0].config_path;
}

async function deleteImportedRow(hashValue) {
  if (!hashValue) return;
  const reason = prompt('請輸入刪除原因（會寫入 audit）：', '資料列內容錯誤，人工刪除');
  if (reason === null) return;
  if (!confirm(`確定要從 SQL 目的表刪除 hash_value=${hashValue} 的資料列？
注意：若資料已進 ES，仍需到 ES 編輯介面另外處理。`)) return;
  const token = authToken();
  const res = await fetch('/v1/excel-to-sql/delete-row', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ config: $('config').value, hash_value: hashValue, reason })
  });
  if (!res.ok) { let text = await res.text(); try { text = JSON.parse(text).detail || text; } catch (_) {} showError(text); return; }
  const data = await res.json();
  showError(`已執行：${data.status}，刪除 ${data.deleted_rows} 筆。`);
  updateEndTsToNow();
  await loadDashboard();
}
function actionCell(r) {
  if (!r.hash_value || r.status === 'sql_deleted') return '';
  return `<button class="secondary" onclick="deleteImportedRow('${escapeHtml(r.hash_value)}')">刪除SQL列</button>`;
}

async function loadDashboard() {
  showError('');
  const token = authToken();
  if (!token) { showError('請先到 /editor 登入；本儀表板會沿用 sra_editor_token。'); return; }
  const pageSize = Math.max(1, Math.min(Number($('limit').value || 100), 1000));
  const params = new URLSearchParams({ config: $('config').value, days: $('days').value, limit: pageSize, page: state.recentPage, chart_bucket: $('chartBucket').value });
  const startIso = localInputToUtcIso('startTs');
  const endIso = localInputToUtcIso('endTs');
  if (startIso) params.set('start_ts', startIso);
  if (endIso) params.set('end_ts', endIso);
  const filters = { status_filter: $('statusFilter').value, source_file_filter: $('sourceFileFilter').value, row_no_filter: $('rowNoFilter').value, message_filter: $('messageFilter').value, hash_value_filter: $('hashFilter').value, payload_filter: $('payloadFilter').value };
  Object.entries(filters).forEach(([key, value]) => { if (String(value || '').trim()) params.set(key, value); });
  selectedValues('destinationTableFilter').forEach(value => params.append('destination_table_filter', value));
  const res = await fetch('/v1/excel-to-sql/dashboard?' + params.toString(), { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) { let text = await res.text(); try { text = JSON.parse(text).detail || text; } catch (_) {} showError(text); return; }
  const data = await res.json();
  document.title = (data.task_name || 'Excel→SQL 匯入 SQL') + ' - 監控儀表板';
  if (!data.exists) showError(`audit table 尚不存在：${data.audit_table}`);
  $('timeBasis').textContent = `audit 時間以本機時間顯示（${Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'}）；起迄時間輸入也是本機時間，系統會轉成 ${data.audit_time_basis || 'UTC'} 查詢。`;
  renderCards(data);
  fillTable('daily', data.daily, r => `<tr><td>${escapeHtml(r.day)}</td><td>${statusBadge(r.status)}</td><td>${escapeHtml(r.count)}</td></tr>`);
  fillTable('files', data.files, r => `<tr><td>${escapeHtml(r.source_file)}</td><td>${escapeHtml(r.last_processed_at)}</td><td>${escapeHtml(r.inserted_rows)}</td><td>${escapeHtml(r.duplicate_rows)}</td><td>${escapeHtml(r.failed_rows)}</td><td>${escapeHtml(r.header_smart_matches)}</td></tr>`);
  renderDestinationTableOptions(data.destination_table_options || []);
  if (data.chart_bucket && $('chartBucket').value !== data.chart_bucket) $('chartBucket').value = data.chart_bucket;
  renderFilteredDailyChart(data.filtered_series || data.filtered_daily || [], data.chart_bucket || $('chartBucket').value, data.chart_bucket_label || $('chartBucket').selectedOptions[0]?.textContent || '每日');
  updateRecentPager(data);
  fillTable('recent', data.recent, r => `<tr><td>${formatAuditTime(r.processed_at)}</td><td>${statusBadge(r.status)}</td><td>${escapeHtml(r.source_file)}</td><td>${escapeHtml(r.row_no ?? '')}</td><td>${escapeHtml(r.message || '')}</td><td>${actionCell(r)}</td><td class="payload-col">${payloadCell(r.row_payload)}</td></tr>`);
}
function bindAuditFilterEvents() {
  ['statusFilter','sourceFileFilter','rowNoFilter','messageFilter','hashFilter','payloadFilter'].forEach(id => {
    const el = $(id);
    el.addEventListener('change', applyAuditFilters);
    el.addEventListener('keydown', event => { if (event.key === 'Enter') applyAuditFilters(); });
  });
  $('destinationTableFilter').addEventListener('change', () => { updateDestinationTableSummary(); closeDestinationTableDropdown(); applyAuditFilters(); });
  $('destinationTableFilter').addEventListener('keydown', event => { if (event.key === 'Enter') { closeDestinationTableDropdown(); applyAuditFilters(); } });
  document.addEventListener('click', event => { if (!$('destinationTableDropdown').contains(event.target)) closeDestinationTableDropdown(); });
  $('limit').addEventListener('change', applyAuditFilters);
  $('chartBucket').addEventListener('change', applyAuditFilters);
}
bindAuditFilterEvents();
(async () => { resetDefaultWindow(); await loadTasks(); await loadDashboard(); })().catch(err => showError(err.message || String(err)));
</script>
</body>
</html>
