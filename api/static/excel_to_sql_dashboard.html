<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excel→SQL 匯入查詢儀表板</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --card:#fff; --line:#d9deea; --text:#172033; --muted:#667085; --ok:#027a48; --warn:#b54708; --bad:#b42318; --info:#175cd3; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { padding:20px 28px; background:#111827; color:white; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    h1 { margin:0; font-size:22px; }
    main { padding:24px; max-width:none; margin:0 auto; }
    .controls, .filters, .cards, .grid { display:grid; gap:16px; }
    .controls { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items:end; margin-bottom:18px; }
    .filters { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items:end; margin:12px 0 14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(16,24,40,.05); }
    .cards { grid-template-columns: repeat(5, minmax(140px, 1fr)); margin-bottom:16px; }
    .upload-actions, .record-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .preview-box { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#f8fafc; }
    .status.uploaded, .status.previewed { background:#eef4ff; color:var(--info); }
    .status.imported { background:#ecfdf3; color:var(--ok); }
    .status.imported_with_errors { background:#fef3f2; color:var(--bad); }
    .status.deleted { background:#f2f4f7; color:#344054; }
    .metric { font-size:28px; font-weight:700; margin-top:6px; }
    .muted { color:var(--muted); font-size:13px; }
    label { font-weight:600; font-size:13px; display:block; margin-bottom:6px; }
    input, select { width:100%; box-sizing:border-box; padding:10px 11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:white; }
    .dropdown-filter { position:relative; }
    .multi-select { position:relative; }
    .multi-select summary { list-style:none; width:100%; box-sizing:border-box; padding:10px 36px 10px 11px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:white; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .multi-select summary::-webkit-details-marker { display:none; }
    .multi-select summary::after { content:'▾'; position:absolute; right:12px; top:10px; color:var(--muted); }
    .multi-select[open] summary { border-bottom-left-radius:0; border-bottom-right-radius:0; }
    .multi-select-menu { position:absolute; z-index:20; top:100%; left:0; right:0; max-height:260px; overflow:auto; padding:8px; border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px; background:white; box-shadow:0 10px 24px rgba(16,24,40,.16); }
    .multi-select-option { display:flex; gap:8px; align-items:flex-start; padding:7px 6px; border-radius:8px; font-size:13px; line-height:1.35; cursor:pointer; word-break:break-word; }
    .multi-select-option:hover { background:#f8fafc; }
    .multi-select-option input { width:auto; margin-top:2px; flex:0 0 auto; }
    .multi-filter-search { margin:4px 0 8px; padding:8px 9px; }
    .multi-filter-actions { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
    .multi-filter-actions button { padding:6px 8px; font-size:12px; }
    .field-label-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
    .field-label-row label { margin-bottom:0; }
    .help-tip { position:relative; display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:white; font-size:12px; font-weight:700; cursor:help; }
    .help-tip::after { content:attr(data-tip); display:none; position:absolute; z-index:30; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); width:max-content; max-width:260px; padding:8px 10px; border-radius:8px; background:#111827; color:white; font-size:12px; font-weight:500; line-height:1.4; box-shadow:0 10px 24px rgba(16,24,40,.18); }
    .help-tip:hover::after, .help-tip:focus::after { display:block; }
    button { padding:10px 14px; border:0; border-radius:10px; background:#2563eb; color:white; font-weight:700; cursor:pointer; }
    button.secondary { background:#475467; }
    button.ghost { background:#e2e8f0; color:#172033; }
    .header-actions { display:flex; gap:10px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
    .header-user { color:#cbd5e1; font-size:13px; font-weight:700; white-space:nowrap; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top; }
    th { color:#344054; font-size:12px; background:#f9fafb; position:sticky; top:0; }
    .table-wrap { overflow:auto; max-height:520px; border:1px solid var(--line); border-radius:12px; }
    .grid { grid-template-columns: 1fr 1.5fr; }
    .status { display:inline-block; border-radius:999px; padding:2px 8px; font-weight:700; font-size:12px; background:#eef4ff; color:var(--info); }
    .status.inserted { background:#ecfdf3; color:var(--ok); }
    .status.duplicate, .status.header_smart_match { background:#fffaeb; color:var(--warn); }
    .status.failed { background:#fef3f2; color:var(--bad); }
    .error { background:#fef3f2; border:1px solid #fecdca; color:var(--bad); padding:12px; border-radius:12px; margin:12px 0; white-space:pre-wrap; }
    .hidden { display:none; }
    .chart-card { border:1px solid var(--line); border-radius:12px; padding:12px; background:#f8fafc; margin:8px 0 14px; }
    .chart-title { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .chart-controls { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
    .chart-controls label { margin-bottom:4px; }
    .chart-controls select { min-width:150px; }
    .audit-chart { width:100%; min-height:240px; display:block; }
    .chart-axis { stroke:#cbd5e1; stroke-width:1; }
    .chart-grid { stroke:#e2e8f0; stroke-width:1; }
    .chart-line { fill:none; stroke:#2563eb; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .chart-point { fill:#2563eb; stroke:white; stroke-width:2; }
    .chart-label { fill:#475467; font-size:11px; }
    .chart-empty { color:var(--muted); padding:48px 0; text-align:center; }
    .recent-toolbar { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin:10px 0 12px; }
    .pager { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .pager button { padding:7px 10px; }
    #recent { table-layout:fixed; width:100%; min-width:1700px; }
    #recent th, #recent td { box-sizing:border-box; overflow-wrap:anywhere; }
    #recent th.time-col, #recent td.time-col { width:10%; min-width:128px; }
    #recent th.status-col, #recent td.status-col { width:7%; }
    #recent th.file-col, #recent td.file-col { width:12%; max-width:260px; white-space:normal; word-break:normal; overflow-wrap:anywhere; }
    #recent th.user-col, #recent td.user-col { width:8%; }
    #recent th.row-col, #recent td.row-col { width:4%; }
    #recent th.message-col, #recent td.message-col { width:13%; overflow-wrap:anywhere; }
    #recent th.action-col, #recent td.action-col { width:6%; }
    #recent th.payload-col, #recent td.payload-col { width:40%; min-width:680px; }
    .json-view { white-space:pre-wrap; overflow-wrap:anywhere; word-break:normal; margin:0; min-width:0; max-width:none; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.5; }
    .json-key { color:#7c3aed; font-weight:700; }
    .json-string { color:#047857; }
    .json-number, .json-boolean { color:#b45309; }
    .json-null { color:#64748b; font-style:italic; }
    pre { white-space:pre-wrap; word-break:break-word; margin:0; }
    @media (max-width: 900px) { .controls, .cards, .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Excel→SQL 匯入查詢儀表板</h1>
      <div class="muted" style="color:#cbd5e1;">追蹤 Excel→SQL 匯入批次、去重、欄名智慧比對與失敗資料列</div>
    </div>
    <div class="header-actions">
      <div id="whoami" class="header-user">未登入</div>
      <button onclick="location.href='/excel-to-sql-import-center'">Excel 匯入作業中心</button>
      <button class="secondary" onclick="location.href='/editor'">前往登入 / 編輯器</button>
    </div>
  </header>
  <main>
    <section class="card controls">
      <div><label>匯入任務</label><select id="task" onchange="onTaskChange()"><option value="">載入中...</option></select></div>
      <div><label>設定檔路徑</label><input id="config" value="config/excel_to_sql/vessel_activities.example.json" /></div>
      <div><label>起始時間（本機）</label><input id="startTs" type="datetime-local" step="1" /></div>
      <div><label>結束時間（本機）</label><input id="endTs" type="datetime-local" step="1" /></div>
      <div><label>回看天數（起迄皆空時才生效）</label><input id="days" type="number" min="1" max="365" value="14" /></div>
      <div><label>列數上限</label><input id="limit" type="number" min="1" max="1000" value="100" /></div>
      <button onclick="refreshDashboardNow()">重新整理</button>
      <button class="ghost" onclick="fillRecentWindow(); refreshDashboardNow();">填入近14天起迄</button>
    </section>

    <div id="msg" class="error hidden"></div>

    <section class="cards" id="cards"></section>

    <section class="grid">
      <div class="card">
        <h2>每日狀態</h2>
        <div class="table-wrap"><table id="daily"><thead><tr><th>日期</th><th>狀態</th><th>筆數</th></tr></thead><tbody></tbody></table></div>
      </div>
      <div class="card">
        <h2>檔案處理彙總</h2>
        <div class="table-wrap"><table id="files"><thead><tr><th>來源檔</th><th>最後處理</th><th>新增</th><th>重複</th><th>失敗</th><th>欄名比對</th></tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <section id="recentAuditSection" class="card" style="margin-top:16px;">
      <h2>最近 audit 事件</h2>
      <p class="muted" id="timeBasis">audit 時間以本機時間顯示；UTC 原始值會以灰字附註。</p>
      <section class="filters" aria-label="最近 audit 事件篩選">
        <div><label>audit 狀態</label><select id="statusFilter"><option value="">全部</option><option value="inserted">inserted</option><option value="duplicate">duplicate</option><option value="failed">failed</option><option value="header_smart_match">header_smart_match</option><option value="sql_deleted">sql_deleted</option><option value="sql_delete_not_found">sql_delete_not_found</option></select></div>
        <div><label>來源檔包含</label><input id="sourceFileFilter" placeholder="例如 .xlsx 或檔名片段" /></div>
        <div class="dropdown-filter"><div class="field-label-row"><label for="usernameSummary">使用者</label><span class="help-tip" tabindex="0" data-tip="點開選單勾選一位或多位使用者；操作方式與統計與檢核曲線儀表板的使用者篩選相同。" aria-label="使用者篩選說明">?</span></div><details id="usernameDropdown" class="multi-select"><summary id="usernameSummary">全體使用者</summary><div class="multi-select-menu"><input id="usernameSearch" class="multi-filter-search" type="search" placeholder="輸入關鍵字篩選清單" autocomplete="off" /><div class="multi-filter-actions"><button id="selectVisibleUsersBtn" class="secondary" type="button">勾選目前篩選</button><button id="clearVisibleUsersBtn" class="secondary" type="button">清除目前篩選</button><button id="clearAllUsersBtn" class="secondary" type="button">清除全部</button></div><div id="usernameFilter" role="group" aria-label="使用者清單"><div class="muted">載入後可選擇</div></div></div></details><input id="usernameFilterValue" type="hidden" /></div>
        <div class="dropdown-filter"><div class="field-label-row"><label for="destinationTableSummary">目的地 table</label><span class="help-tip" tabindex="0" data-tip="點開選單選擇 table；點選多個項目後，點選選單外側會自動套用並收合。" aria-label="目的地 table 篩選說明">?</span></div><details id="destinationTableDropdown" class="multi-select"><summary id="destinationTableSummary">全部目的地 table</summary><div id="destinationTableFilter" class="multi-select-menu" role="listbox" aria-label="目的地 table 篩選"><div class="muted">載入後可選擇</div></div></details></div>
        <div><label>列號</label><input id="rowNoFilter" type="number" min="1" placeholder="Excel row_no" /></div>
        <div><label>訊息包含</label><input id="messageFilter" placeholder="錯誤訊息 / 智慧比對" /></div>
        <div><label>hash 包含</label><input id="hashFilter" placeholder="hash_value 片段" /></div>
        <div><label>payload 關鍵字</label><input id="payloadFilter" placeholder="payload JSON 文字" /></div>
        <button onclick="applyAuditFilters()">套用篩選</button>
        <button class="secondary" onclick="clearAuditFilters()">清空 audit 篩選</button>
      </section>
      <div class="chart-card">
        <div class="chart-title">
          <div>
            <strong id="filteredSeriesTitle">audit 筆數統計曲線（套用目前篩選）</strong>
            <div class="muted" id="filteredDailySummary">尚未載入</div>
          </div>
          <div class="chart-controls" aria-label="曲線圖時間區間設定">
            <div>
              <label for="chartBucket">曲線圖時間區間</label>
              <select id="chartBucket">
                <option value="hour">每小時</option>
                <option value="6_hours">每 6 小時</option>
                <option value="12_hours">每 12 小時</option>
                <option value="day" selected>每日</option>
                <option value="week">每週</option>
                <option value="month">每月</option>
              </select>
            </div>
          </div>
        </div>
        <div id="filteredDailyChart" class="chart-empty">尚未載入圖表</div>
      </div>
      <div class="recent-toolbar">
        <div class="muted" id="recentPageInfo">第 1 頁</div>
        <div class="pager">
          <button class="ghost" id="recentPrevBtn" onclick="changeRecentPage(-1)">上一頁</button>
          <button class="ghost" id="recentNextBtn" onclick="changeRecentPage(1)">下一頁</button>
        </div>
      </div>
      <div class="table-wrap"><table id="recent"><colgroup><col class="time-col"><col class="status-col"><col class="file-col"><col class="user-col"><col class="row-col"><col class="message-col"><col class="action-col"><col class="payload-col"></colgroup><thead><tr><th class="time-col">時間（本機）</th><th class="status-col">狀態</th><th class="file-col">檔案</th><th class="user-col">使用者</th><th class="row-col">列號</th><th class="message-col">訊息</th><th class="action-col">操作</th><th class="payload-col">payload</th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>
<script src="/static/audit_tools.js"></script>
<script src="/static/excel_to_sql_dashboard.js?v=20260615-split"></script>
</body>
</html>
